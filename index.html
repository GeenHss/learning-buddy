<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leermaatje</title>
<!-- Installable app (PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EAF5FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leermaatje">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF5FF; --ink:#22304F; --muted:#55627F; --card:#FFFFFF; --line:#CFE2F5;
    --primary:#2F7FD8; --primary-d:#1F5FA8; --good:#1F9D6B; --ok:#F29A2E; --bad:#E5534B; --star:#FFB81F;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:'Fredoka',system-ui,sans-serif;background:var(--bg);color:var(--ink);
       -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  .app{max-width:780px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px 16px 28px}

  /* Header */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:28px;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
  .brand .logo{width:42px;height:42px;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:24px;transform:rotate(-6deg)}
  .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:18px}
  .lang{display:flex;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px}
  .lang button{border:0;background:transparent;font-weight:600;padding:6px 12px;border-radius:999px;color:var(--muted)}
  .lang button.on{background:var(--primary);color:#fff}
  .toggle{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 8px 5px 12px;font-weight:600;font-size:16px}
  .switch{width:40px;height:24px;border-radius:999px;background:#D9D4C7;position:relative;transition:background .2s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .toggle.on .switch{background:var(--good)}
  .toggle.on .switch::after{left:19px}

  /* Level map */
  h1{font-size:30px;margin:4px 0 4px}
  .sub{color:var(--muted);font-size:18px;margin:0 0 18px}
  .levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .level{position:relative;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px 14px 14px;
         text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px;
         box-shadow:0 5px 0 var(--line);transition:transform .12s}
  .level:hover:not(.locked){transform:translateY(-2px)}
  .level:active:not(.locked){transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
  .level .num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:22px;color:#fff}
  .level .name{font-weight:600;font-size:19px;line-height:1.2}
  .level .stars{margin-top:auto;font-size:22px;letter-spacing:2px}
  .level.locked{opacity:.55;cursor:not-allowed}
  .level.locked .num{background:#B9B6CC!important}
  .star-on{color:var(--star)} .star-off{color:#CBD9E8}
  .lock{position:absolute;right:12px;top:12px;font-size:20px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;
         padding:12px 20px;border-radius:16px;font-size:17px;transition:transform .25s;z-index:20;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* Play */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .back{border:2px solid var(--line);background:#fff;border-radius:14px;width:48px;height:48px;font-size:22px;flex:none}
  .dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
  .dot{flex:1;min-width:14px;height:14px;border-radius:999px;background:#D5E6F7}
  .dot.cur{background:#C9C7F3;outline:3px solid var(--primary);outline-offset:1px}
  .dot.g{background:var(--good)} .dot.o{background:var(--ok)} .dot.r{background:var(--bad)}
  .levelname{color:var(--muted);font-size:17px;margin:0 0 8px;text-align:center}

  .card{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:20px 16px 18px;text-align:center;box-shadow:0 6px 0 var(--line)}
  .pics{display:flex;align-items:center;justify-content:center;gap:14px;min-height:20px;margin-bottom:10px;flex-wrap:wrap}
  .group{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:34px;line-height:1.1}
  .group span{position:relative}
  .group span.gone{opacity:.35}
  .group span.gone::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--bad);font-weight:700;font-size:34px;opacity:1}
  .carton{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(300px,86vw);padding:10px;border-radius:16px;
          background:#CDBB9E;box-shadow:inset 0 -5px 0 #B49F80,0 3px 0 #A89272}
  .cup{aspect-ratio:1;border-radius:50%;background:#B9A585;box-shadow:inset 0 5px 7px rgba(70,50,20,.35);display:grid;place-items:center;position:relative}
  .egg{width:68%;height:84%;border-radius:50% 50% 50% 50% / 60% 60% 42% 42%;
       background:radial-gradient(circle at 35% 28%,#FFFFFF,#F4EDE1 55%,#DDD0BA);box-shadow:0 2px 3px rgba(60,40,10,.35)}
  .egg.b{background:radial-gradient(circle at 35% 28%,#F8D2A8,#D58A48 55%,#AE6830)}
  .egg.gone{opacity:.4}
  .cup.x::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--bad);font-weight:700;font-size:30px}
  .op-sign{font-size:36px;font-weight:700;color:var(--muted)}
  .sum{font-size:64px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
  .answer{min-width:120px;height:92px;border-radius:20px;border:4px dashed #C9C7F3;display:grid;place-items:center;color:var(--primary);background:#F6F5FF}
  .answer.filled{border-style:solid;border-color:var(--primary)}
  .answer.good{border-color:var(--good);color:var(--good);background:#E8F7EF}
  .answer.bad{border-color:var(--bad);color:var(--bad);background:#FDECEA}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .feedback{min-height:34px;font-size:24px;font-weight:600;margin-top:6px}
  .feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px auto 0;max-width:380px;width:100%}
  .key{height:68px;border-radius:18px;border:0;background:#fff;font-size:32px;font-weight:600;box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
  .key:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
  .key.go{background:var(--good);color:#fff;border-color:var(--good);box-shadow:0 5px 0 #1A7E52}
  .key.del{color:var(--muted)}
  .key:disabled{opacity:.5}

  /* Result */
  .result{text-align:center;padding-top:20px}
  .big-stars{font-size:76px;letter-spacing:6px;margin:10px 0}
  .big-stars span{display:inline-block;animation:pop .5s both}
  .big-stars span:nth-child(2){animation-delay:.25s} .big-stars span:nth-child(3){animation-delay:.5s}
  @keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
  .result h2{font-size:38px;margin:6px 0}
  .result p{font-size:20px;color:var(--muted);margin:0 0 24px}
  .btns{display:flex;flex-direction:column;gap:12px;max-width:340px;margin:0 auto}
  .btn{border:0;border-radius:18px;padding:16px;font-size:22px;font-weight:600;background:#fff;border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 5px 0 var(--primary-d)}
  .btn:active{transform:translateY(3px)}

  /* Flashcards (splitsingen) */
  .sec{font-size:26px;margin:30px 0 4px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{width:64px;height:64px;border-radius:18px;background:#fff;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font-size:28px;font-weight:700}
  .chip.wide{width:auto;padding:0 18px;font-size:19px;font-weight:600}
  .chip:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
  .chip.keep{border-color:#24A86E;background:#E8F7EF;color:#1A7E52}
  .count{font-weight:600;font-size:18px;color:var(--muted);margin-left:auto}
  .flip{perspective:1200px;cursor:pointer;max-width:440px;margin:0 auto;width:100%}
  .flip-inner{display:grid;transition:transform .5s;transform-style:preserve-3d}
  .flip.on .flip-inner{transform:rotateY(180deg)}
  .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:3px solid var(--line);border-radius:28px;
        box-shadow:0 6px 0 var(--line);padding:24px 16px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:300px}
  .face.rear{transform:rotateY(180deg);background:#F6FBF8;border-color:#CDEBDC}
  .hint{color:var(--muted);font-size:17px}
  .split{display:flex;flex-direction:column;align-items:center;width:240px}
  .split-top{width:96px;height:80px;border-radius:20px;background:var(--primary);color:#fff;font-size:52px;font-weight:700;display:grid;place-items:center}
  .split-lines{width:200px;height:44px;display:block}
  .split-lines line{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
  .split-bottom{display:flex;justify-content:space-between;width:240px}
  .sbox{width:92px;height:80px;border-radius:20px;border:4px solid var(--line);background:#fff;font-size:48px;font-weight:700;display:grid;place-items:center}
  .sbox.q{border:4px dashed #C9C7F3;color:var(--primary);background:#F6F5FF}
  .sbox.ans{border-color:var(--good);color:var(--good);background:#E8F7EF}
  .rate{display:flex;gap:12px;max-width:440px;margin:18px auto 0}
  .rate .btn{flex:1}
  .btn.good{background:var(--good);color:#fff;border-color:var(--good);box-shadow:0 5px 0 #1A7E52}

  /* Profiles */
  .who{padding:5px 14px 5px 6px}
  .who-av{width:30px;height:30px;border-radius:50%;background:#F4EEFF;display:grid;place-items:center;font-size:20px}
  .profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
  .pcard-wrap{position:relative}
  .pcard{width:100%;background:#fff;border:3px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--line);padding:20px 12px 16px;
         display:flex;flex-direction:column;align-items:center;gap:6px;min-height:190px;justify-content:center}
  .pcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
  .pcard .avatar{width:84px;height:84px;border-radius:50%;background:#F4EEFF;display:grid;place-items:center;font-size:50px}
  .pcard.add{border-style:dashed;color:var(--muted)}
  .pcard.add .avatar{background:transparent;border:3px dashed var(--line);font-size:38px}
  .pname{font-weight:600;font-size:22px}
  .pstars{font-size:18px;color:var(--muted)}
  .pedit{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--muted);font-size:17px}
  .form{background:#fff;border:3px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;max-width:520px}
  .flabel{font-weight:600;font-size:18px}
  .finput{font:inherit;font-size:24px;padding:12px 16px;border:3px solid var(--line);border-radius:16px;outline:none;user-select:text;-webkit-user-select:text}
  .finput:focus{border-color:var(--primary)}
  .avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .av{aspect-ratio:1;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:30px}
  .av.on{border-color:var(--primary);background:#F4EEFF}

  /* Week / streak card */
  .week{display:flex;gap:18px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--line);padding:14px 18px;margin:4px 0 18px}
  .flame{flex:none;width:96px;height:96px;border-radius:22px;background:linear-gradient(160deg,#FFE3C2,#FFC98F);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .fnum{font-size:30px;font-weight:700;color:#C2410C}
  .flab{font-size:13px;font-weight:600;color:#9A3412;text-align:center;line-height:1.1}
  .week-body{flex:1;min-width:0}
  .week-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:20px;flex-wrap:wrap}
  .week-top span{font-size:15px;color:var(--muted);font-weight:600}
  .days{display:flex;gap:6px;margin:8px 0 6px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
  .dc{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;background:#E3EEF9;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
  .day.done .dc{background:#F97316}
  .day.today .dc{outline:3px solid #F97316;outline-offset:2px}
  .dl{font-size:13px;color:var(--muted);font-weight:600}
  .week-msg{font-size:15px;color:var(--ink);font-weight:500}
  /* Per-section stats on tiles */
  .tstats{margin-top:auto;width:100%;padding-top:8px}
  .trow{display:flex;justify-content:space-between;font-size:17px;font-weight:600;color:var(--muted)}
  .tbrain{color:#D6407E}
  .tstats .bar{height:12px;margin:6px 0 4px}
  .tnext{font-size:14px;color:var(--muted)}

  /* Brain power */
  .brain{display:flex;gap:16px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--line);
         padding:14px 18px;margin:4px 0 18px}
  .brain-ico{font-size:52px;width:76px;height:76px;border-radius:50%;background:#FFE9F1;display:grid;place-items:center;flex:none}
  .brain-body{flex:1;min-width:0}
  .brain-top{display:flex;justify-content:space-between;align-items:baseline;font-size:21px;gap:8px}
  .brain-lvl{font-weight:700;color:#D6407E}
  .bar{height:16px;border-radius:999px;background:#F6E9EE;margin:8px 0 6px;overflow:hidden}
  .bar div{height:100%;border-radius:999px;background:linear-gradient(90deg,#FF8FB8,#D6407E);transition:width .6s}
  .brain-sub{font-size:16px;font-weight:600;color:var(--ink)}
  .brain-tip{font-size:15px;color:var(--muted);margin-top:2px}
  #brainPill.bump{animation:pop .6s}
  .card{position:relative}
  .plus{position:absolute;right:18px;top:14px;font-weight:700;font-size:22px;color:#D6407E;animation:floatUp 1.1s ease-out forwards;pointer-events:none}
  @keyframes floatUp{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
  .result p.gain{color:#D6407E;font-weight:600;margin-top:-14px}

  /* Reading & writing */
  .tiles.three{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .tile-word{font-size:40px;letter-spacing:1px}
  .tile-emoji{font-size:36px}
  .tile-art{overflow:hidden}
  .letters-mini{gap:10px}
  .letters-mini span{width:50px;height:58px;border-radius:14px;background:#fff;border:3px solid var(--tc);display:grid;place-items:center;font-size:40px}
  .letters-mini .q{border-style:dashed}
  .level .ex{font-size:15px;color:var(--muted)}
  .readword{font-size:84px;font-weight:600;letter-spacing:4px;margin:10px 0 4px;line-height:1.1}
  .hint{color:var(--muted);font-size:17px}
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px auto 0;max-width:480px}
  .choice{aspect-ratio:1;border-radius:24px;background:#fff;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font-size:64px}
  .choice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
  .choice.right{border-color:var(--good);background:#E8F7EF}
  .choice.wrong{border-color:var(--bad);background:#FDECEA;opacity:.6;animation:shake .4s}
  .wpic{font-size:96px;line-height:1.1;margin:4px 0 10px}
  .slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .slot{width:52px;height:64px;border-radius:14px;border:3px dashed #E6C79C;background:#EAF5FF;display:grid;place-items:center;font-size:40px;font-weight:600;color:var(--ink)}
  .slot.cur{border-style:solid;border-color:var(--ok)}
  .slot.done{border-style:solid;border-color:#E6C79C;background:#fff}
  .slot.bad{border-color:var(--bad);background:#FDECEA}
  .slot.good{border-color:var(--good);background:#E8F7EF;color:var(--good)}
  .letters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px auto 0;max-width:520px}
  .ltile{width:64px;height:68px;border-radius:16px;background:#fff;border:2px solid var(--line);box-shadow:0 5px 0 var(--line);font-size:36px;font-weight:600}
  .ltile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
  .ltile.wide{width:auto;min-width:84px;padding:0 14px}
  .klanken{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .kl{display:inline-block;padding:2px 10px;border-radius:16px;background:#EEF0FF;border-bottom:5px solid #C9C7F3}
  .kl.v{background:#FFE9F1;border-bottom-color:#F4A7C4;color:#B8336A}
  .needs{font-size:14px;font-weight:600;color:#B8336A}
  .topbar .push{margin-left:auto}
  .ltile.glow{border-color:var(--ok);background:#FFF1DF;animation:pulse 1s ease-in-out 3}
  @keyframes pulse{50%{transform:scale(1.15)}}
  @media (max-width:480px){ .readword{font-size:64px} .slot{width:42px;height:54px;font-size:32px} .ltile{width:56px;height:60px} }

  .sound{font-size:120px;font-weight:600;line-height:1;letter-spacing:4px;color:var(--ink)}
  .sound.small{font-size:56px;color:var(--primary)}
  .sound-pic{font-size:80px;line-height:1}
  .sound-word{font-size:52px;font-weight:600;letter-spacing:3px}
  .sound-word mark{background:#FFE08A;color:var(--ink);border-radius:10px;padding:0 4px}

  .clock{width:min(260px,70vw);height:auto;display:block;margin:4px auto 10px}
  .clock .nums{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:600;fill:#2B2A4C}
  .clock.mini{width:112px;margin:0}
  .tchoices.clocks{display:grid;grid-template-columns:repeat(3,1fr);max-width:560px}
  .tchoices.clocks .tchoice{padding:8px}
  .clock.choice{width:100%;margin:0}
  .tchoices.digis .tchoice{font-family:'Courier New',monospace;font-size:34px;font-weight:700;letter-spacing:2px}
  .timeword{font-size:56px;font-weight:700;margin:14px 0 6px;color:var(--primary)}
  .tchoices{display:flex;flex-direction:column;gap:12px;margin:18px auto 0;max-width:420px}
  .tchoice{border-radius:20px;background:#fff;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font-size:28px;font-weight:600;padding:14px}
  .tchoice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
  .tchoice.right{border-color:var(--good);background:#E8F7EF;color:var(--good)}
  .tchoice.wrong{border-color:var(--bad);background:#FDECEA;opacity:.6;animation:shake .4s}

  /* More sums */
  .answer.wait{border-style:dashed;border-color:#E3E0F5;background:#FAFAFF}
  .answer.small{min-width:68px;height:60px;font-size:36px;border-radius:14px;border-width:3px}
  .sum.text{font-size:40px;flex-wrap:wrap}
  .sum.pm{font-size:52px;gap:10px;flex-wrap:wrap}
  .sum.pm .answer{min-width:76px;height:80px}
  .sumgrid{display:grid;grid-template-columns:repeat(5,auto);column-gap:14px;row-gap:4px;align-items:center;justify-content:center;
           font-size:64px;font-weight:700;margin:6px 0}
  .bsplit{grid-column:3;grid-row:2;display:flex;flex-direction:column;align-items:center;font-size:initial}

/* ============================================================
   STORAGE — kept in one place so it can later be swapped for
   a parent/teacher account backend without touching the game.
   ============================================================ */
const Store = {
  key:'rekenhelden.v1',
  load(){ try{ return JSON.parse(localStorage.getItem(this.key)) || null; }catch(e){ return null; } },
  save(data){ try{ localStorage.setItem(this.key, JSON.stringify(data)); }catch(e){} }
};
/* Each child has a profile with their own stars and picture setting.
   The language setting is shared by the whole device. */
const AVATARS = ['🦊','🐼','🦄','🐸','🐯','🐙','🦁','🐰','🐧','🐨','🐶','🐱'];
const MAX_PROFILES = 6;
const saved = Store.load() || {};
const state = { lang: saved.lang || 'nl', profiles: saved.profiles || [], current: saved.current || null };
// Move progress from the earlier single-player version into a first profile
if(!saved.profiles && saved.stars && Object.keys(saved.stars).length){
  state.profiles.push({ id:newId(), name:'', avatar:AVATARS[0], stars:saved.stars, pics: saved.pics !== false });
}
function newId(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function cur(){ return state.profiles.find(p => p.id===state.current) || null; }
function persist(){ Store.save({ lang:state.lang, profiles:state.profiles, current:state.current }); }
function picsOn(){ const p = cur(); return !p || p.pics !== false; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function displayName(p){ return p.name || t('player', {n: state.profiles.indexOf(p)+1}); }

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function t(key, vars){
  let s = key.split('.').reduce((o,k)=>o[k], T[state.lang]);
  if(vars) for(const k in vars) s = s.replace('{'+k+'}', vars[k]);
  return s;
}
function levelName(i){ const L = LEVELS[i]; return L.kind ? t('kindNames')[L.kind] : t('names.'+L.op, {n:L.max}); }
function starsOf(i){ const p = cur(); return (p && p.stars[i]) || 0; }
// All levels are open: children can pick any level. Stars only show progress.
function unlocked(i){ return true; }
function sumStars(map){ return Object.values(map || {}).reduce((a,b)=>a+b,0); }
function sectionStars(p, sec){
  const k = {read:'starsRead', write:'starsWrite', clock:'starsClock', measure:'starsMeasure'}[sec]; if(!p[k]) p[k] = {};
  if(sec==='read' && !p.readV2){   // reading got 2 sound levels in front of the word levels
    const old = p.starsRead; p.starsRead = {}; for(const i in old) p.starsRead[+i + 2] = old[i];
    p.readV2 = true;
  }
  return p[k];
}
function totalStars(p = cur()){ return p ? sumStars(p.stars) + sumStars(p.starsRead) + sumStars(p.starsWrite) + sumStars(p.starsClock) + sumStars(p.starsMeasure) : 0; }
function starRow(n){ let h=''; for(let k=0;k<3;k++) h += `<span class="${k<n?'star-on':'star-off'}">★</span>`; return h; }

const toastQueue = []; let toastBusy = false;
function toast(msg){ toastQueue.push(msg); if(!toastBusy) nextToast(); }
function nextToast(){
  const el = $('#toast'); const msg = toastQueue.shift();
  if(!msg){ toastBusy = false; return; }
  toastBusy = true; el.textContent = msg; el.classList.add('show');
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(nextToast, 300); }, 2400);
}

/* ============================================================
   BRAIN POWER — rewards practice. Every finished set (level or
   flashcard round) adds one point, also when replaying. Stars reward new levels.
   ============================================================ */
function brainInfo(points){
  let lvl = 1, base = 0, need = 3;           // level 2 after 3 sets, then 4 more, 5 more …
  while(points >= base + need){ base += need; lvl++; need += 1; }
  return { lvl, into: points - base, need };
}
// Brain power is kept per section: 'math', 'read', 'write'
function brainPts(p, sec){
  if(!p.brainBy){ p.brainBy = { math: p.brain || 0, read:0, write:0 }; delete p.brain; }  // older versions had one total
  return p.brainBy[sec] || 0;
}
function addBrain(sec, n){
  const p = cur(); if(!p) return;
  const before = brainInfo(brainPts(p, sec)).lvl;
  p.brainBy[sec] = brainPts(p, sec) + n;
  markPracticed(p);
  persist(); renderChrome();
  const after = brainInfo(p.brainBy[sec]).lvl;
  if(after > before) toast(t('brainUp', {s: t('sec_'+sec), n: after}));
}

/* ============================================================
   PRACTICE STREAK — the overall reward: days in a row with at
   least one finished round (any section).
   ============================================================ */
function dayKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function markPracticed(p){
  const k = dayKey(new Date()); p.days = p.days || [];
  if(!p.days.includes(k)){
    p.days.push(k); if(p.days.length > 400) p.days = p.days.slice(-400);
    setTimeout(() => toast(t('streakUp', {n: streak(p)})), 50);
  }
}
function streak(p){
  const set = new Set(p.days || []); const d = new Date();
  if(!set.has(dayKey(d))) d.setDate(d.getDate() - 1);   // today not done yet: streak can still continue
  let n = 0; while(set.has(dayKey(d))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function weekCard(p){
  const set = new Set(p.days || []); const now = new Date();
  const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  let days = '', count = 0;
  for(let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const done = set.has(dayKey(d)), isToday = dayKey(d)===dayKey(now);
    if(done) count++;
    days += `<div class="day ${done?'done':''} ${isToday?'today':''}"><div class="dc">${done?'✓':''}</div><div class="dl">${t('dayNames')[i]}</div></div>`;
  }
  const s = streak(p), doneToday = set.has(dayKey(now));
  const msg = s===0 ? t('streak0') : (doneToday ? t('streakDone') : t('streakKeep'));
  return `<div class="week">
    <div class="flame"><div class="fnum">🔥 ${s}</div><div class="flab">${t(s===1?'streakDay':'streakDays')}</div></div>
    <div class="week-body">

      <div class="days">${days}</div>

    </div>
  </div>`;
}

/* ============================================================
   SPECIAL SUMS — every problem has one or more answer boxes that
   are filled in order (boxes[step]). A box holds a number or + / −.
   ============================================================ */
function makeSpecial(kind, prev, q){
  for(let tries=0; tries<40; tries++){
    const p = makeSpecialOnce(kind, prev, q);
    if(!prev || p.key !== prev.key) return p;
  }
  return makeSpecialOnce(kind, null, q);
}
function makeSpecialOnce(kind, prev, q){
  const P = o => Object.assign({ kind, step:0 }, o);
  if(kind==='line'){
    // Pairs: first a sum below 10, then the same sum ten higher (5+3, then 15+3)
    if(q % 2 === 1 && prev && prev.kind==='line' && prev.a < 10){
      const a = prev.a + 10, b = prev.b, op = prev.op, ans = op==='add' ? a+b : a-b;
      return P({ op, a, b, ans, key:'L'+op+a+'-'+b, boxes:[{ans}] });
    }
    const op = Math.random() < .5 ? 'add' : 'sub';
    let a, b;
    if(op==='add'){ a = rand(1,8); b = rand(1, 9-a); } else { a = rand(3,9); b = rand(1, a-1); }
    const ans = op==='add' ? a+b : a-b;
    return P({ op, a, b, ans, key:'L'+op+a+'-'+b, boxes:[{ans}] });
  }
  if(kind==='bridge'){
    const a = rand(5,9), b = rand(11-a, 9), s1 = 10-a, s2 = b - s1;
    return P({ op:'add', a, b, ans:a+b, s1, s2, key:'B'+a+'-'+b, boxes:[{ans:s1},{ans:s2},{ans:a+b}] });
  }
  if(kind==='double'){
    if(Math.random() < .5){ const n = rand(1,10); return P({ sub:'dbl', n, key:'D'+n, boxes:[{ans:2*n}] }); }
    const m = 2*rand(1,10); return P({ sub:'half', n:m, key:'H'+m, boxes:[{ans:m/2}] });
  }
  if(kind==='missing'){
    if(Math.random() < .5){ const c = rand(5,20), a = rand(1,c-1); return P({ op:'add', a, c, key:'M+'+a+'-'+c, boxes:[{ans:c-a}] }); }
    const a = rand(5,20), x = rand(1,a), c = a - x; return P({ op:'sub', a, c, key:'M-'+a+'-'+c, boxes:[{ans:x}] });
  }
  // plusmin: a … b … c = r, with b ≠ c so there is exactly one right answer
  for(;;){
    const a = rand(10,20), b = rand(1,9), c = rand(1,9);
    if(b===c) continue;
    const o1 = pick(['+','-']), o2 = pick(['+','-']);
    const mid = o1==='+' ? a+b : a-b, r = o2==='+' ? mid+c : mid-c;
    if(mid < 0 || mid > 20 || r < 0 || r > 20) continue;
    return P({ a, b, c, r, key:'P'+a+o1+b+o2+c, boxes:[{ans:o1, op:true},{ans:o2, op:true}] });
  }
}

/* Number line 0–20 with the jump drawn, like the workbook */
function numberLineSVG(a, b, op){
  const x0 = 24, w = 28, X = v => x0 + v*w, end = op==='add' ? a+b : a-b, y = 70;
  let ticks = '';
  for(let v=0; v<=20; v++){
    const big = v%5===0;
    ticks += `<line x1="${X(v)}" y1="${y-(big?12:7)}" x2="${X(v)}" y2="${y+(big?12:7)}" stroke="#2B2A4C" stroke-width="${big?3:2}"/>`;
    if(big && v!==a) ticks += `<text x="${X(v)}" y="${y+34}" text-anchor="middle" class="snum">${v}</text>`;
  }
  const xa = X(a), xe = X(end), top = 22, sign = op==='add' ? '+' : '−';
  return `<svg class="pic nline" viewBox="0 0 ${x0*2 + 20*w} 112" aria-hidden="true">
    <line x1="${X(0)}" y1="${y}" x2="${X(20)}" y2="${y}" stroke="#2B2A4C" stroke-width="3"/>
    ${ticks}
    <path d="M${xa} ${y-14} L${xa} ${top} L${xe} ${top} L${xe} ${y-16}" fill="none" stroke="#24A86E" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="${xe-6},${y-22} ${xe+6},${y-22} ${xe},${y-12}" fill="#24A86E"/>
    <text x="${(xa+xe)/2}" y="${top-6}" text-anchor="middle" class="snum jump">${sign}${b}</text>
    <rect x="${xa-15}" y="${y+16}" width="30" height="26" rx="7" fill="#fff" stroke="#2B2A4C" stroke-width="2"/>
    <text x="${xa}" y="${y+34}" text-anchor="middle" class="snum">${a}</text>
  </svg>`;
}

/* ============================================================
   PROBLEM GENERATOR
   ============================================================ */
function makeProblem(L, prev, q){
  if(L.kind) return makeSpecial(L.kind, prev, q || 0);
  for(let tries=0; tries<30; tries++){
    const op = L.op==='mix' ? (Math.random()<.5?'add':'sub') : L.op;
    const low = L.max>10 ? 8 : 2;
    let a,b,ans;
    if(op==='add'){ ans = rand(low, L.max); a = rand(1, ans-1); b = ans - a; }
    else          { a = rand(low, L.max);   b = rand(1, a-1);   ans = a - b; }
    const p = { kind:'basic', op, a, b, ans, obj: pick(OBJECTS), step:0, boxes:[{ans}] };
    if(!prev || prev.a!==a || prev.b!==b || prev.op!==op) return p;
  }
}

/* ============================================================
   FLASHCARDS — splitsingen (number splits)
   Front: the number with one part filled in, one part "?".
   Back:  the full split (+ egg carton when pictures are on).
   "Practise again" puts the card back at the end of the pile.
   ============================================================ */
let flash = null;

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function startFlash(which){
  let deck = [];
  const add = n => { for(let k=1;k<n;k++) deck.push({ n, k, blank: Math.random()<.5 ? 'l' : 'r', fmt:'split' }); };
  if(which==='mix'){ for(let n=5;n<=10;n++) add(n); deck = shuffle(deck).slice(0,10); }
  else if(which==='keep'){
    // Keep practising: 20 cards — every split of 10 (0 + 10 … 10 + 0) plus 9 from 6, 7, 8 and 9
    for(let k=0;k<=10;k++) deck.push({ n:10, k, blank: Math.random()<.5 ? 'l' : 'r', fmt:'split' });
    const more = []; for(let n=6;n<=9;n++) for(let k=1;k<n;k++) more.push({ n, k, blank: Math.random()<.5 ? 'l' : 'r', fmt:'split' });
    deck = shuffle(deck.concat(shuffle(more).slice(0,9)));
  }
  else if(+which===10){   // 10 also gets 0 + 10 and 10 + 0
    for(let k=0;k<=10;k++) deck.push({ n:10, k, blank: Math.random()<.5 ? 'l' : 'r', fmt:'split' });
    shuffle(deck);
  }
  else { add(+which); shuffle(deck); }
  flash = { which, deck, total:deck.length, missed:new Set(), flipped:false, gained:0 };
  screen = 'flash';
  renderFlash();
}

function splitHTML(c, show){
  const box = (side, val) => {

    return show ? `<div class="sbox ans">${val}</div>` : `<div class="sbox q"></div>`;
  };
  return `<div class="split">
    <div class="split-top">${c.n}</div>
    <svg class="split-lines" viewBox="0 0 200 44"><line x1="100" y1="4" x2="46" y2="40"/><line x1="100" y1="4" x2="154" y2="40"/></svg>
    <div class="split-bottom">${box('l', c.k)}${box('r', c.n - c.k)}</div>
  </div>`;
}

function startLevel(i){
  game = { level:i, q:0, firstTry:0, attempts:0, input:'', busy:false, results:[], problem:null, gained:0 };
  game.problem = makeProblem(LEVELS[i], null, 0);
  screen = 'play';
  renderPlay();
}

function picturesHTML(p){
  if(!picsOn() || !LEVELS[game.level].pics) return '';
  // Egg cartons of 10 (2 rows of 5), filled top row first, like the school books.
  // Addition: first number = white eggs, second number = brown eggs.
  // Subtraction: the eggs being taken away are crossed out.
  const eggs = [];
  if(p.op==='add'){ for(let k=0;k<p.a;k++) eggs.push('a'); for(let k=0;k<p.b;k++) eggs.push('b'); }
  else { for(let k=0;k<p.a;k++) eggs.push(k < p.a - p.b ? 'a' : 'a gone'); }
  return `<div class="pics">${cartonsHTML(eggs)}</div>`;
}

function cartonsHTML(eggs){
  const cartons = Math.max(1, Math.ceil(eggs.length / 10));
  let h = '';
  for(let c=0;c<cartons;c++){
    let cups = '';
    for(let k=0;k<10;k++){
      const e = eggs[c*10 + k];
      cups += `<div class="cup ${e && e.includes('gone') ? 'x' : ''}">${e ? `<div class="egg ${e}"></div>` : ''}</div>`;
    }
    h += `<div class="carton">${cups}</div>`;
  }
  return h;
}

function renderPlay(){
  const p = game.problem;
  let dots = '';
  for(let k=0;k<QUESTIONS_PER_LEVEL;k++){
    const r = game.results[k];
    dots += `<div class="dot ${r||''} ${k===game.q && !r?'cur':''}"></div>`;
  }
  $('#main').innerHTML = `
    <div class="topbar">
      <button class="back" data-action="home" aria-label="back">←</button>
      <div class="dots">${dots}</div>
    </div>
    <p class="levelname">${levelName(game.level)}</p>
    <div class="card">
      ${picturesHTML(p)}
      <div id="sumArea"></div>
      <div class="hint" id="stepHint"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="pad" id="pad"></div>`;
  renderSum();
}

const opSym = v => v==='-' ? '−' : v;
function curBox(){ const p = game.problem; return p.boxes[p.step]; }

/* One answer box: done (green/red), active (shows what is typed) or still empty */
function boxHTML(i, small){
  const p = game.problem, b = p.boxes[i], cls = small ? ' small' : '';
  if(i < p.step) return `<div class="answer filled ${b.state||'good'}${cls}">${opSym(b.val)}</div>`;
  if(i === p.step) return `<div class="answer ${game.input?'filled':''}${cls}" id="answer">${opSym(game.input)}</div>`;
  return `<div class="answer wait${cls}"></div>`;
}

function problemHTML(p){
  const sym = p.op==='sub' ? '−' : '+';
  if(p.kind==='basic' || p.kind==='line'){
    return `${p.kind==='line' ? `<div class="martwrap">${numberLineSVG(p.a, p.b, p.op)}</div>` : ''}
      <div class="sum"><span>${p.a}</span><span>${sym}</span><span>${p.b}</span><span>=</span>${boxHTML(0)}</div>`;
  }
  if(p.kind==='bridge'){
    let eggs = '';
    if(picsOn()){ const arr = []; for(let k=0;k<p.a;k++) arr.push('a'); for(let k=0;k<p.b;k++) arr.push('b'); eggs = `<div class="pics">${cartonsHTML(arr)}</div>`; }
    return `${eggs}
      <div class="sumgrid">
        <span>${p.a}</span><span>+</span><span>${p.b}</span><span>=</span>${boxHTML(2)}
        <div class="bsplit">
          <svg viewBox="0 0 100 30" aria-hidden="true"><line x1="50" y1="2" x2="18" y2="28"/><line x1="50" y1="2" x2="82" y2="28"/></svg>
          <div class="bboxes">${boxHTML(0,true)}${boxHTML(1,true)}</div>
        </div>
      </div>`;
  }
  if(p.kind==='double'){
    return `<div class="sum text"><span>${t(p.sub==='dbl' ? 'dblOf' : 'halfOf', {n:p.n})}</span>${boxHTML(0)}</div>`;
  }
  if(p.kind==='missing'){
    return `<div class="sum"><span>${p.a}</span><span>${sym}</span>${boxHTML(0)}<span>=</span><span>${p.c}</span></div>`;
  }
  return `<div class="sum pm"><span>${p.a}</span>${boxHTML(0)}<span>${p.b}</span>${boxHTML(1)}<span>${p.c}</span><span>=</span><span>${p.r}</span></div>`;
}

function stepHint(p){
  if(p.kind==='bridge') return [t('bHint1', {a:p.a}), t('bHint2', {b:p.b, s:p.s1}), t('bHint3', {a:p.a, b:p.b})][p.step] || '';
  if(p.kind==='line') return t('lineHint');
  if(p.kind==='plusmin') return t('pmHint');
  return '';
}

function renderSum(cls){
  const p = game.problem;
  $('#sumArea').innerHTML = problemHTML(p);
  $('#stepHint').textContent = stepHint(p);
  const box = curBox(), pad = $('#pad');
  const wantOps = !!(box && box.op);
  if(pad.dataset.ops !== String(wantOps)){
    pad.dataset.ops = String(wantOps);
    if(wantOps){
      pad.className = 'pad ops';
      pad.innerHTML = `<button class="key opkey" data-key="+">+</button><button class="key opkey" data-key="-">−</button>`;
    } else {
      pad.className = 'pad';
      let keys = '';
      [1,2,3,4,5,6,7,8,9].forEach(n => keys += `<button class="key" data-key="${n}">${n}</button>`);
      keys += `<button class="key del" data-key="del" aria-label="delete">⌫</button>
               <button class="key" data-key="0">0</button>
               <button class="key go" data-key="ok" aria-label="check">✓</button>`;
      pad.innerHTML = keys;
    }
  }
  if(cls){ const el = $('#answer'); if(el) el.classList.add(cls); }
}

function press(k){
  if(screen!=='play' || game.busy) return;
  const box = curBox(); if(!box) return;
  if(box.op){
    if(k==='+' || k==='-'){ game.input = k; renderSum(); check(); }
    return;
  }
  if(k==='del'){ game.input = game.input.slice(0,-1); }
  else if(k==='ok'){ return check(); }
  else if(/^[0-9]$/.test(k) && game.input.length < 2){ game.input = (game.input==='0' ? '' : game.input) + k; }
  else return;
  $('#feedback').textContent = ''; $('#feedback').className = 'feedback';
  renderSum();
}

function check(){
  if(game.input==='') return;
  const p = game.problem, box = curBox(), fb = $('#feedback');
  if(game.input === String(box.ans)){
    box.val = game.input; box.state = 'good'; p.step++; game.input = '';
    if(p.step < p.boxes.length){ fb.textContent = ''; fb.className = 'feedback'; renderSum(); return; }
    if(game.attempts===0) game.firstTry++;
    game.results[game.q] = p.revealed ? 'r' : (game.attempts===0 ? 'g' : 'o');
    if(p.kind==='basic'){ record('m:'+p.a+(p.op==='add'?'+':'-')+p.b, game.attempts===0 && !p.revealed); persist(); }
    renderSum();
    fb.textContent = pick(T[state.lang].good); fb.className = 'feedback good';
    game.busy = true; setTimeout(nextQuestion, 1000);
  } else {
    game.attempts++; box.wrong = (box.wrong || 0) + 1;
    if(box.wrong >= 2){
      // show the right answer in this box and carry on
      box.val = String(box.ans); box.state = 'bad'; p.revealed = true; p.step++; game.input = '';
      fb.textContent = t('answerIs', {n: opSym(box.ans)}); fb.className = 'feedback bad';
      renderSum();
      game.busy = true;
      if(p.step >= p.boxes.length){ game.results[game.q] = 'r'; setTimeout(nextQuestion, 2000); }
      else setTimeout(() => { game.busy = false; fb.textContent = ''; fb.className = 'feedback'; renderSum(); }, 1500);
    } else {
      renderSum('bad');
      const el = $('#answer'); if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
      fb.textContent = t('tryAgain'); fb.className = 'feedback bad';
      game.input = '';
      setTimeout(() => { if(!game.busy && screen==='play') renderSum(); }, 600);
    }
  }
}

function nextQuestion(){
  if(screen!=='play') return;
  game.q++;
  if(game.q >= QUESTIONS_PER_LEVEL) return finish();
  game.problem = makeProblem(LEVELS[game.level], game.problem, game.q);
  game.attempts = 0; game.input = ''; game.busy = false;
  renderPlay();
}

function scoreOf(results){ return results.reduce((a, r) => a + (r==='g' ? 1 : r==='o' ? 0.5 : 0), 0); }
function starsFor(score, total = QUESTIONS_PER_LEVEL){
  if(score >= total) return 3;
  if(score >= total*0.7) return 2;
  return 1;   // finishing a round always earns a star
}

function finish(){
  screen = 'result';
  const i = game.level, earned = starsFor(scoreOf(game.results));
  const wasLocked = i+1 < LEVELS.length && !unlocked(i+1);
  addBrain('math', 1); game.gained = 1;   // one brain point per finished set
  cur().stars[i] = Math.max(starsOf(i), earned);
  persist(); renderChrome();
  const canNext = i+1 < LEVELS.length && unlocked(i+1);
  $('#main').innerHTML = `
    <div class="result">
      <div class="big-stars">${starRow(earned)}</div>
      <h2>${t('res')[earned]}</h2>
      <p>${t('score', {c:game.firstTry, n:QUESTIONS_PER_LEVEL})}</p>
      ${gainHTML(game.gained)}
      <div class="btns">
        ${canNext ? `<button class="btn primary" data-action="next">${t('next')}</button>` : ''}
        <button class="btn ${canNext?'':'primary'}" data-action="again">${t('again')}</button>
        <button class="btn" data-action="home">${t('home')}</button>
      </div>
    </div>`;
  if(earned >= 2) confetti();
  if(wasLocked && canNext) setTimeout(()=>toast(t('newLevel')), 900);
}

function confetti(){
  const colors = ['#FF8A5B','#FFC233','#2DB37A','#2FA4D8','#5B5BD6','#E0569B'];
  for(let k=0;k<60;k++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = pick(colors);
    c.style.animationDuration = (2 + Math.random()*2) + 's';
    c.style.animationDelay = Math.random()*0.6 + 's';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5000);
  }
}

   Writing: see the picture, build the word with letter tiles.
   Word lists per language; 3 levels (short → long words).

     ['t|r|ai|n','🚆'],['s|n|ai|l','🐌'],['r|i|ng','💍'],['qu|ee|n','👑'],['b|oo|k','📖'],['c|l|o|ck','🕒'],['s|o|ck','🧦']],
    [['r|o|ck|e|t','🚀'],['r|o|b|o|t','🤖'],['p|u|m|p|k|i|n','🎃'],['s|a|n|d|w|i|ch','🥪'],['ch|i|ck|e|n','🐔'],['h|o|t|d|o|g','🌭'],['l|e|m|o|n','🍋'],

const wordOf = w => w[0].replace(/\|/g, '');
const soundsOf = w => w[0].split('|');
const VOWELISH = /[aeiouy]/;
// Writing levels follow the reading order (easy sounds → tricky sounds → long words)
const WORD_LEVELS = [ {color:'#E0569B'}, {color:'#F29A2E'}, {color:'#5B5BD6'} ];

/* Reading follows how Dutch schools teach it:
   first easy sounds, then harder sounds (oe, eu …), then words.
   Each sound has an example word (with the sound in it) + picture. */
const SOUNDS = {

  },
  en: {
    easy: [['s','sun','☀️'],['a','ant','🐜'],['t','tent','⛺'],['p','pig','🐷'],['i','pin','📌'],['n','nose','👃'],['m','moon','🌙'],['d','dog','🐶'],
           ['g','goat','🐐'],['o','fox','🦊'],['c','cat','🐱'],['k','key','🔑'],['e','egg','🥚'],['u','bus','🚌'],['r','rose','🌹'],['h','hat','🎩'],

    hard: [['sh','ship','🚢'],['ch','cheese','🧀'],['th','thumb','👍'],['ng','ring','💍'],['ee','bee','🐝'],['oo','moon','🌙'],['ai','train','🚆'],

const READ_LEVELS = [
  { type:'sound', set:'easy', color:'#2FA4D8' },
  { type:'sound', set:'hard', color:'#24A86E' },
  { type:'word',  words:0,    color:'#E0569B' },
  { type:'word',  words:1,    color:'#F29A2E' },
  { type:'word',  words:2,    color:'#5B5BD6' },
];
const SOUNDS_PER_SET = 10;
function levelsFor(mode){ return mode==='read' ? READ_LEVELS : WORD_LEVELS; }
function wordListIndex(mode, i){ return mode==='read' ? READ_LEVELS[i].words : i; }
function wordLevelName(mode, i){ return mode==='read' ? t('readLv')[i] : t('wordLv')[i]; }
const WORDS_PER_SET = 8;
let wgame = null;

function wordStarsOf(mode, i){ const p = cur(); return p ? (sectionStars(p, mode)[i] || 0) : 0; }
function needsReading(mode, i){ return false; }   // levels are never blocked
function wordUnlocked(mode, i){ return true; }
function klankOn(){ const p = cur(); return !p || p.klank !== false; }

/* Klankhulp: show a word as coloured sound blocks */
function klankHTML(w){
  return `<span class="klanken">${soundsOf(w).map(sd => `<span class="kl ${VOWELISH.test(sd)?'v':''}">${sd}</span>`).join('')}</span>`;
}
function klankToggle(){
  return `<button class="toggle ${klankOn()?'on':''}" data-action="klank" role="switch" aria-checked="${klankOn()}"><span>🧩</span><span>${t('klankhulp')}</span><span class="switch"></span></button>`;
}

function renderWordLevels(mode){
  screen = 'wordLevels';
  wgame = { mode };
  let cards = '';
  levelsFor(mode).forEach((L,i)=>{
    const open = wordUnlocked(mode, i);
    const ex = (mode==='read' && L.type==='sound')
      ? SOUNDS[state.lang][L.set].slice(0,4).map(x => x[0]).join(' · ')
      : WORDS[state.lang][wordListIndex(mode, i)].slice(0,3).map(wordOf).join(' · ');
    const waitRead = needsReading(mode, i) ? `<div class="needs">📖 ${t('needRead', {lvl: t('readLv')[L.needRead]})}</div>` : '';
    cards += `<button class="level ${open?'':'locked'}" data-wlevel="${i}">
      ${open?'':'<span class="lock">🔒</span>'}
      <div class="num" style="background:${L.color}">${i+1}</div>
      <div class="name">${wordLevelName(mode, i)}</div>
      <div class="ex">${ex}</div>${waitRead}
      <div class="stars">${starRow(wordStarsOf(mode, i))}</div>
    </button>`;
  });
  $('#main').innerHTML = `
    <div class="topbar"><button class="back" data-action="menu" aria-label="back">←</button>
      <h1 class="inline">${mode==='read' ? '📖 '+t('menuRead') : '✏️ '+t('menuWrite')}</h1>
      ${mode==='read' ? `<div class="push">${klankToggle()}</div>` : ''}</div>
    <p class="sub">${mode==='read' ? t('menuReadSub') : t('menuWriteSub')}</p>
    <div class="levels">${cards}</div>`;
}

function startWordLevel(mode, i){
  if(mode==='read' && READ_LEVELS[i].type==='sound') return startSounds(i);
  const list = shuffle(WORDS[state.lang][wordListIndex(mode, i)].slice()).slice(0, WORDS_PER_SET);
  wgame = { mode, level:i, list, q:0, firstTry:0, mistakes:0, wrongHere:0, results:[], busy:false, pos:0, buf:'', gained:0 };
  screen = 'word';
  renderWord();
}

function wordDots(){
  let d = '';
  for(let k=0;k<WORDS_PER_SET;k++){ const r = wgame.results[k]; d += `<div class="dot ${r||''} ${k===wgame.q && !r?'cur':''}"></div>`; }
  return d;
}

/* Sound tiles for writing: the word's own sounds + look-alikes she might confuse them with */
const LOOKALIKE = { aa:['a'], ee:['e'], oo:['o'], uu:['u'], ie:['i'], oe:['o','oo'], eu:['e','u'], ui:['u','uu'], ei:['ij'], ij:['ei'],
  ou:['au'], au:['ou'], ng:['n','nk'], nk:['ng','n'], ch:['g'], sch:['s'], a:['aa'], e:['ee'], o:['oo'], u:['uu'], i:['ie'],
  sh:['s'], th:['t'], ck:['k'], ai:['a'], oa:['o'], ar:['a'], or:['o'], qu:['k'] };
function soundTiles(w, wordLevel){
  const own = [...new Set(soundsOf(w))];
  let extra = [];
  if(wordLevel > 0){   // level 1 (easy sounds) gets only plain letters as extra tiles
    own.forEach(sd => (LOOKALIKE[sd] || []).forEach(x => {
      if(wordLevel < 2 && ((sd==='ei' && x==='ij') || (sd==='ij' && x==='ei'))) return;   // ei/ij only in the last level
      extra.push(x);
    }));
  }
  extra = [...new Set(extra)].filter(x => !own.includes(x));
  const singles = shuffle('abdeghiklmnoprstuvwz'.split('').filter(l => !own.includes(l) && !extra.includes(l)));
  while(own.length + extra.length < 8 && singles.length) extra.push(singles.pop());
  return shuffle([...own, ...extra.slice(0, Math.max(3, 9 - own.length))]);
}

function renderWord(){
  const w = wgame.list[wgame.q], pic = w[1], snds = soundsOf(w);
  let body = '';
  if(wgame.mode==='read'){
    if(!wgame.choices){
      const pool = WORDS[state.lang].flat().filter(x => x[1]!==pic);
      wgame.choices = shuffle([pic, ...shuffle(pool.slice()).slice(0,2).map(x=>x[1])]);
    }
    body = `
      <div class="card">
        <div class="readword">${klankOn() ? klankHTML(w) : wordOf(w)}</div>
        <div class="hint">${t('readQ')}</div>
        <div class="feedback" id="feedback"></div>
      </div>
      <div class="choices">${wgame.choices.map(c => `<button class="choice" data-choice="${c}">${c}</button>`).join('')}</div>`;
  } else {
    if(!wgame.tiles) wgame.tiles = soundTiles(w, wgame.level);
    let slots = '';
    snds.forEach((sd,k) => {
      const txt = k < wgame.pos ? sd : (k===wgame.pos ? wgame.buf : '');
      slots += `<div class="slot ${k<wgame.pos?'done':''} ${k===wgame.pos?'cur':''}" style="min-width:${30 + 22*sd.length}px">${txt}</div>`;
    });
    body = `
      <div class="card">
        <div class="wpic">${pic}</div>
        <div class="slots" id="slots">${slots}</div>
        <div class="hint">${t('writeQ')}</div>
        <div class="feedback" id="feedback"></div>
      </div>
      <div class="letters">${wgame.tiles.map(x => `<button class="ltile ${x.length>1?'wide':''}" data-letter="${x}">${x}</button>`).join('')}</div>`;
  }
  $('#main').innerHTML = `
    <div class="topbar">
      <button class="back" data-action="wordLevels" aria-label="back">←</button>
      <div class="dots">${wordDots()}</div>
    </div>
    <p class="levelname">${wordLevelName(wgame.mode, wgame.level)}</p>
    ${body}`;
}

function wordFeedback(text, cls){ const fb = $('#feedback'); fb.textContent = text; fb.className = 'feedback ' + cls; }

function chooseReading(btn){
  if(wgame.busy || btn.disabled) return;
  const pic = wgame.list[wgame.q][1];
  if(btn.dataset.choice === pic){
    btn.classList.add('right');
    wgame.results[wgame.q] = wgame.mistakes===0 ? 'g' : 'o';
    if(wgame.mistakes===0) wgame.firstTry++;
    record('r:'+state.lang+':'+wordOf(wgame.list[wgame.q]), wgame.mistakes===0); persist();

    wordFeedback(pick(T[state.lang].good), 'good');
    wgame.busy = true; setTimeout(nextWord, 1000);
  } else {
    wgame.mistakes++;
    btn.classList.add('wrong'); btn.disabled = true;
    if(wgame.mistakes >= 2){
      wgame.results[wgame.q] = 'r';
      document.querySelector(`[data-choice="${pic}"]`).classList.add('right');
      wordFeedback(t('wordWas', {w: wordOf(wgame.list[wgame.q])}), 'bad');
      wgame.busy = true; setTimeout(nextWord, 2000);
    } else wordFeedback(t('tryAgain'), 'bad');
  }
}

/* A whole sound was chosen (tile tap, or completed by typing) */
function typeSound(sd){
  if(wgame.busy) return;
  const snds = soundsOf(wgame.list[wgame.q]), need = snds[wgame.pos];
  wgame.buf = '';
  if(sd === need){
    wgame.pos++; wgame.wrongHere = 0;
    if(wgame.pos === snds.length){
      wgame.results[wgame.q] = wgame.mistakes===0 ? 'g' : (wgame.mistakes<=2 ? 'o' : 'r');
      record('s:'+state.lang+':'+wordOf(wgame.list[wgame.q]), wgame.mistakes===0); persist();

      if(wgame.mistakes===0) wgame.firstTry++;
      renderWord(); wordFeedback(pick(T[state.lang].good), 'good');
      document.querySelectorAll('.slot').forEach(x => x.classList.add('good'));
      wgame.busy = true; setTimeout(nextWord, 1200);
    } else renderWord();
  } else {
    wgame.mistakes++; wgame.wrongHere++;
    renderWord();
    const slot = document.querySelectorAll('.slot')[wgame.pos];
    slot.classList.remove('shake','bad'); void slot.offsetWidth; slot.classList.add('shake','bad');
    // Picked part of the sound (o instead of oo, n instead of ng): a gentle, specific hint
    if(need.length > sd.length && need.startsWith(sd)) wordFeedback(t('moreLetters', {n: need.length}), 'bad');
    else if(sd.length > need.length && sd.startsWith(need)) wordFeedback(t('fewerLetters'), 'bad');
    else wordFeedback(t('tryAgain'), 'bad');
    if(wgame.wrongHere >= 2) document.querySelectorAll(`[data-letter="${need}"]`).forEach(b => b.classList.add('glow'));
  }
}
/* Typing on a keyboard: letters collect until they make the sound */
function typeKey(l){
  if(wgame.busy) return;
  const need = soundsOf(wgame.list[wgame.q])[wgame.pos], buf = wgame.buf + l;
  if(buf === need) return typeSound(buf);
  if(need.startsWith(buf)){ wgame.buf = buf; renderWord(); return; }
  typeSound(buf);
}

function nextWord(){
  if(screen!=='word') return;
  wgame.q++;
  if(wgame.q >= WORDS_PER_SET) return finishWords();
  Object.assign(wgame, { mistakes:0, wrongHere:0, busy:false, pos:0, buf:'', choices:null, tiles:null });
  renderWord();
}

/* ============================================================
   CLOCK — read an analogue clock, pick the right time.
   Dutch: "half 4" = 3:30, "kwart voor 4" = 3:45.
   ============================================================ */
const CLOCK_LEVELS = [ {kind:'hour', color:'#2FA4D8'}, {kind:'half', color:'#24A86E'}, {kind:'quarter', color:'#5B5BD6'}, {kind:'digital', color:'#E0569B'}, {kind:'mix', color:'#2B2A4C'} ];
const CLOCK_PER_SET = 8;
let cgame = null;

function nextH(h){ return h % 12 + 1; }
function prevH(h){ return (h + 10) % 12 + 1; }
function timeLabel(h, m){
  if(state.lang==='nl'){
    if(m===0)  return `${h} uur`;
    if(m===30) return `half ${nextH(h)}`;
    if(m===15) return `kwart over ${h}`;
    return `kwart voor ${nextH(h)}`;
  }
  if(m===0)  return `${h} o'clock`;
  if(m===30) return `half past ${h}`;
  if(m===15) return `quarter past ${h}`;
  return `quarter to ${nextH(h)}`;
}
function digitalHTML(h, m){ return `<div class="digital">${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}</div>`; }
function clockMinutes(kind){
  if(kind==='hour') return [0];
  if(kind==='half' || kind==='digital') return [0,30,30];
  if(kind==='mix') return [0,0,30,30,15,45];
  return [15,45,15,45,0,30];
}
function makeTime(kind, prev){
  for(let k=0;k<20;k++){
    const tm = { h: rand(1,12), m: pick(clockMinutes(kind)) };
    if(!prev || prev.h!==tm.h || prev.m!==tm.m) return tm;
  }
}
// Two tempting wrong times (hour off by one, or another minute option), each with a different label
function clockDistractors(kind, tm){
  const ms = [...new Set(clockMinutes(kind))];
  const cands = [ {h:nextH(tm.h), m:tm.m}, {h:prevH(tm.h), m:tm.m} ];
  ms.forEach(m => { if(m!==tm.m){ cands.push({h:tm.h, m}); cands.push({h:nextH(tm.h), m}); } });
  const right = timeLabel(tm.h, tm.m), seen = new Set([right]), out = [];
  for(const c of shuffle(cands)){ const l = timeLabel(c.h, c.m); if(!seen.has(l)){ seen.add(l); out.push(c); } if(out.length===2) break; }
  return out;
}
const digitalText = (h, m) => `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

function clockSVG(h, m, cls=''){
  const pt = (deg, r) => { const a = deg*Math.PI/180; return [100 + r*Math.sin(a), 100 - r*Math.cos(a)]; };
  let ticks = '', nums = '';
  for(let i=0;i<60;i++){
    const big = i%5===0, [x1,y1] = pt(i*6, big?82:86), [x2,y2] = pt(i*6, 91);
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2B2A4C" stroke-width="${big?3:1.2}" stroke-linecap="round"/>`;
  }
  for(let n=1;n<=12;n++){ const [x,y] = pt(n*30, 71); nums += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${n}</text>`; }
  const [hx,hy] = pt(((h%12) + m/60)*30, 40), [mx,my] = pt(m*6, 58);
  return `<svg class="clock ${cls}" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="94" fill="#fff" stroke="#2B2A4C" stroke-width="6"/>
    ${ticks}<g class="nums">${nums}</g>
    <line x1="100" y1="100" x2="${mx}" y2="${my}" stroke="#2FA4D8" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="${hx}" y2="${hy}" stroke="#EE5D52" stroke-width="10" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="7" fill="#2B2A4C"/>
  </svg>`;
}

function clockStarsOf(i){ const p = cur(); return p ? (sectionStars(p,'clock')[i] || 0) : 0; }
function clockUnlocked(i){ return true; }

function renderClockLevels(){
  screen = 'clockLevels';
  let cards = '';
  CLOCK_LEVELS.forEach((L,i)=>{
    const open = clockUnlocked(i);
    cards += `<button class="level ${open?'':'locked'}" data-clevel="${i}">
      ${open?'':'<span class="lock">🔒</span>'}
      <div class="num" style="background:${L.color}">${i+1}</div>
      <div class="name">${t('clockLv')[i]}</div>
      <div class="ex">${t('clockEx')[i]}</div>
      <div class="stars">${starRow(clockStarsOf(i))}</div>
    </button>`;
  });
  $('#main').innerHTML = `
    <div class="topbar"><button class="back" data-action="menu" aria-label="back">←</button><h1 class="inline">🕒 ${t('menuClock')}</h1></div>
    <p class="sub">${t('clockHint')}</p><div class="levels">${cards}</div>`;
}

/* One clock question. Types:
   read      – analogue clock → pick the time in words
   digital   – digital clock  → pick the time in words
   pick      – time in words  → pick the right analogue clock
   toDigital – analogue clock → pick the matching digital time
   The "mix" level changes type and minutes every question. */
function makeClockQ(levelKind, prevTime){
  const time = makeTime(levelKind, prevTime);
  const type = levelKind==='mix' ? pick(['read','digital','pick','toDigital'])
             : (levelKind==='digital' ? 'digital' : 'read');
  const all = shuffle([time, ...clockDistractors(levelKind, time)]);
  const lbl = x => timeLabel(x.h, x.m);
  let choices, answer, answerText = lbl(time), prompt = t('clockQ');
  if(type==='pick'){
    choices = all.map(x => ({ key: lbl(x), html: clockSVG(x.h, x.m, 'choice') })); answer = lbl(time); prompt = t('clockPickQ');
  } else if(type==='toDigital'){
    choices = all.map(x => ({ key: digitalText(x.h, x.m), html: digitalText(x.h, x.m) })); answer = digitalText(time.h, time.m);
    answerText = answer; prompt = t('clockDigQ');
  } else {
    choices = all.map(x => ({ key: lbl(x), html: lbl(x) })); answer = lbl(time);
  }
  return { time, type, choices, answer, answerText, prompt };
}

function startClock(i){
  cgame = { level:i, q:0, firstTry:0, mistakes:0, results:[], busy:false };
  cgame.item = makeClockQ(CLOCK_LEVELS[i].kind);
  screen = 'clock'; renderClock();
}
function renderClock(){
  const it = cgame.item, tm = it.time;
  let dots = '';
  for(let k=0;k<CLOCK_PER_SET;k++){ const r = cgame.results[k]; dots += `<div class="dot ${r||''} ${k===cgame.q && !r?'cur':''}"></div>`; }
  const show = it.type==='digital' ? digitalHTML(tm.h, tm.m)
             : it.type==='pick' ? `<div class="timeword">${timeLabel(tm.h, tm.m)}</div>`
             : clockSVG(tm.h, tm.m);
  $('#main').innerHTML = `
    <div class="topbar"><button class="back" data-action="clockLevels" aria-label="back">←</button><div class="dots">${dots}</div></div>
    <p class="levelname">${t('clockLv')[cgame.level]}</p>
    <div class="card">
      ${show}
      <div class="hint">${it.prompt}</div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="tchoices ${it.type==='pick' ? 'clocks' : ''} ${it.type==='toDigital' ? 'digis' : ''}">
      ${it.choices.map(c => `<button class="tchoice" data-ctime="${c.key}">${c.html}</button>`).join('')}</div>`;
}
function chooseTime(btn){
  if(cgame.busy || btn.disabled) return;
  const it = cgame.item, fb = $('#feedback');
  if(btn.dataset.ctime === it.answer){
    btn.classList.add('right');
    cgame.results[cgame.q] = cgame.mistakes===0 ? 'g' : 'o';
    if(cgame.mistakes===0) cgame.firstTry++;
    fb.textContent = pick(T[state.lang].good); fb.className = 'feedback good';
    cgame.busy = true; setTimeout(nextClock, 1000);
  } else {
    cgame.mistakes++; btn.classList.add('wrong'); btn.disabled = true;
    if(cgame.mistakes >= 2){
      cgame.results[cgame.q] = 'r';
      document.querySelectorAll('.tchoice').forEach(b => { if(b.dataset.ctime===it.answer) b.classList.add('right'); });
      fb.textContent = t('clockWas', {w:it.answerText}); fb.className = 'feedback bad';
      cgame.busy = true; setTimeout(nextClock, 2200);
    } else { fb.textContent = t('tryAgain'); fb.className = 'feedback bad'; }
  }
}
function nextClock(){
  if(screen!=='clock') return;
  cgame.q++;
  if(cgame.q >= CLOCK_PER_SET) return finishClock();
  Object.assign(cgame, { mistakes:0, busy:false, item: makeClockQ(CLOCK_LEVELS[cgame.level].kind, cgame.item.time) });
  renderClock();
}
function finishClock(){
  screen = 'clockResult';
  const i = cgame.level, earned = starsFor(scoreOf(cgame.results), CLOCK_PER_SET), map = sectionStars(cur(), 'clock');
  const wasLocked = i+1 < CLOCK_LEVELS.length && !clockUnlocked(i+1);
  addBrain('math', 1);
  map[i] = Math.max(map[i] || 0, earned);
  persist(); renderChrome();
  const canNext = i+1 < CLOCK_LEVELS.length && clockUnlocked(i+1);
  $('#main').innerHTML = `
    <div class="result">
      <div class="big-stars">${starRow(earned)}</div>
      <h2>${t('res')[earned]}</h2>
      <p>${t('clockScore', {c:cgame.firstTry, n:CLOCK_PER_SET})}</p>
      ${gainHTML(1)}
      <div class="btns">
        ${canNext ? `<button class="btn primary" data-action="clockNext">${t('next')}</button>` : ''}
        <button class="btn ${canNext?'':'primary'}" data-action="clockAgain">${t('again')}</button>
        <button class="btn" data-action="clockLevels">${t('home')}</button>
      </div>
    </div>`;
  if(earned >= 2) confetti();
  if(wasLocked && canNext) toast(t('newLevel'));
}

function bucketSVG(n){

function weightSVGs(list, cx, baseY, unknown){

function balanceSVG(tilt, leftHTML, rightHTML){

    ${pan(xl, yl)}${pan(xr, yr)}

function makeMeasure(kind, prevKey){
  for(let k=0;k<20;k++){
    const q = makeMeasureOnce(kind);
    if(q.key !== prevKey) return q;
  }
}
function makeMeasureOnce(kind){
  if(kind==='length'){
    const n = rand(2,12);
    return { key:'l'+n, art: rulerSVG(n), q: t('qLength'), answer: n+' cm', choices: numChoices(n, 1, 12, v => v+' cm') };
  }
  if(kind==='weight'){
    const n = rand(1,10);
    return { key:'w'+n, art: scaleSVG(n), q: t('qWeight'), answer: n+' kg', choices: numChoices(n, 0, 10, v => v+' kg') };
  }
  if(kind==='volume'){
    const n = rand(1,10), fmt = v => v+' '+t('liter'), r = Math.random();
    if(r < .4) return { key:'v'+n, art: bucketSVG(n), q: t('qVolume'), answer: fmt(n), choices: numChoices(n, 1, 10, fmt) };
    if(r < .7) return { key:'c'+n, art: cartonsHTMLm(n), q: t('qCartons'), answer: fmt(n), choices: numChoices(n, 1, 10, fmt) };
    const cans = []; const k = rand(2,3); for(let i=0;i<k;i++) cans.push(pick([5,2,2,1,1])); cans.sort((a,b)=>b-a);
    const tot = cans.reduce((a,b)=>a+b,0);
    return { key:'j'+cans.join('-'), art: cansHTML(cans), q: t('qCans'), answer: fmt(tot), choices: numChoices(tot, 1, 15, fmt) };
  }
  if(kind==='balance'){
    if(Math.random() < .5){
      const [o1, o2] = shuffle(['📦','🎁','🧸','🍉','🥥','🎒','⚽','🍍']).slice(0,2), tilt = pick([1,-1]);
      const em = e => (x, y) => `<text x="${x}" y="${y-4}" text-anchor="middle" font-size="46">${e}</text>`;
      const choices = [t('left'), t('right')];
      return { key:'b'+o1+tilt, art: balanceSVG(tilt, em(o1), em(o2)), q: t('qHeavy'), answer: tilt===1 ? choices[0] : choices[1], choices };
    }
    const left = []; const k = rand(2,3); for(let i=0;i<k;i++) left.push(rand(1,5));
    const tot = left.reduce((a,b)=>a+b,0), fmt = v => v+' kg';
    const art = balanceSVG(0, (x,y) => weightSVGs(left, x, y), (x,y) => weightSVGs([Math.min(tot,6)], x, y, true));
    return { key:'B'+left.join('-'), art, q: t('qOther'), answer: fmt(tot), choices: numChoices(tot, 1, 15, fmt) };
  }
  if(kind==='litre'){
    const it = pick(LITRE_ITEMS), choices = [t('lessL'), t('moreL')];
    const art = `<div class="litre"><div class="lbig">${it[0]}</div><div class="lname">${state.lang==='nl' ? it[1] : it[2]}</div>
      <div class="lref">🥛 ${t('oneLitre')}</div></div>`;
    return { key:'L'+it[0], art, q: t('qLitre'), answer: it[3] ? choices[1] : choices[0], choices };
  }
  if(kind==='pay'){
    const price = rand(3,20), best = fewest(price);
    // a longer way to pay the same amount: break one note or coin into smaller ones
    const alt = best.slice(), bi = alt.findIndex(v => v > 1);
    const split = { 20:[10,10], 10:[5,5], 5:[2,2,1], 2:[1,1] }[alt[bi]];
    alt.splice(bi, 1, ...split); alt.sort((a,b)=>b-a);
    let off; do { off = price + pick([-2,-1,1,2]); } while(off < 1);
    const wrong = fewest(off);
    const opts = [best, alt, wrong].map(moneyHTML), answer = opts[0];
    const art = `<div class="paytag"><span class="pitem">${pick(PAY_ITEMS)}</span><span class="tag">€ ${price}</span></div>`;
    return { key:'p'+price, art, q: t('qPay'), answer, choices: shuffle(opts), wide:true };
  }
  if(kind==='money' && Math.random() < .35){
    const purse = rand(5,15), coins = []; const k = rand(1,3); for(let i=0;i<k;i++) coins.push(pick([2,2,1]));
    coins.sort((a,b)=>b-a); const tot = purse + coins.reduce((a,b)=>a+b,0), fmt = v => '€ ' + v;
    const art = `<div class="pursewrap"><div class="purse"><span>€ ${purse}</span></div><span class="plus">+</span>${moneyHTML(coins)}</div>`;
    return { key:'P'+purse+coins.join(''), art, q: t('qPurse'), answer: fmt(tot), choices: numChoices(tot, 1, 30, fmt) };
  }
  if(kind==='money'){
    let items, total;
    do {
      items = []; const k = rand(2,4);
      for(let i=0;i<k;i++) items.push(pick([20,10,10,5,5,2,2,1,1]));
      items.sort((a,b) => b-a); total = items.reduce((a,b)=>a+b,0);
    } while(total > 30);
    const fmt = v => '€ ' + v;
    return { key:'m'+items.join('-'), art: moneyHTML(items), q: t('qMoney'), answer: fmt(total), choices: numChoices(total, 1, 40, fmt) };
  }
  const kinds = ['circle','triangle','square','rect'], sh = pick(kinds), nm = T[state.lang].shapes;
  const others = shuffle(kinds.filter(x => x!==sh)).slice(0,2);
  return { key:'s'+sh, art: shapeSVG(sh), q: t('qShape'), answer: nm[sh], choices: shuffle([sh, ...others]).map(x => nm[x]) };
}

/* ============================================================
   MEMORY — the app remembers every sum, split, klank and word
   per child. Boxes 0–4: wrong → box 0 (comes back soon);
   right → one box up (comes back after 0, 0, 1, 3, 7 days).
   An item counts as "known" from box 2.
   ============================================================ */
const BOX_DAYS = [0, 0, 1, 3, 7];
function dayNum(){ const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset()*60000) / 864e5); }
function memOf(p, key){ return (p && p.mem && p.mem[key]) || null; }
function record(key, ok, p){
  p = p || cur(); if(!p) return;
  p.mem = p.mem || {};
  const m = p.mem[key] || (p.mem[key] = { b:0, r:0, w:0, d:0 });
  const first = m.r + m.w === 0;
  if(ok){ m.r++; m.b = first ? 2 : Math.min(4, m.b + 1); } else { m.w++; m.b = 0; }
  m.d = dayNum() + BOX_DAYS[m.b];
}

/* ---------- Learning steps (leerlijn), in the order school teaches them ---------- */
const _mathSkills = {}; const _langSkills = {};
function mathSkills(){
  if(_mathSkills[state.lang]) return _mathSkills[state.lang];
  const S = [], add = (id, items, g) => S.push({ id, items, g: g || (['tel5','tel10','plus5','min5'].includes(id) ? 2 : 3) });
  const cnt = (a, b) => { const o = []; for(let n=a;n<=b;n++) o.push({ key:'c:'+n, type:'count', n }); return o; };
  const sums = (op, test) => { const o = [];
    for(let a=1;a<=20;a++) for(let b=1;b<=20;b++){
      const ans = op==='add' ? a+b : a-b;
      if(ans >= 0 && test(a, b, ans)) o.push({ key:'m:'+a+(op==='add'?'+':'-')+b, type:'sum', op, a, b, ans });
    } return o; };
  const split = ns => { const o = []; ns.forEach(n => { for(let k=1;k<n;k++) o.push({ key:'p:'+n+':'+k, type:'split', n, k }); }); return o; };
  add('tel5',   cnt(1,5));
  add('tel10',  cnt(6,10));
  add('plus5',  sums('add', (a,b,s) => s <= 5));
  add('min5',   sums('sub', (a,b,s) => a <= 5 && s >= 1));
  add('split5', split([2,3,4,5]));
  add('split7', split([6,7]));
  add('split9', split([8,9]));
  add('split10',split([10]));
  add('plus10', sums('add', (a,b,s) => s >= 6 && s <= 10));
  add('min10',  sums('sub', (a,b,s) => a >= 6 && a <= 10 && s >= 1));
  add('dubbel', sums('add', (a,b,s) => a === b && a <= 10));
  add('plus20', sums('add', (a,b,s) => a >= 10 && s <= 20 && b <= 10));
  add('min20',  sums('sub', (a,b,s) => a >= 11 && a <= 20 && s >= 10));
  add('brugp',  sums('add', (a,b,s) => a <= 9 && b <= 9 && s >= 11));
  add('brugm',  sums('sub', (a,b,s) => a >= 11 && a <= 18 && b <= 9 && s <= 9));
  /* ---------- Groep 4, 5 and 6 (added after the groep 3 steps, so saved start steps keep their place) ---------- */
  const N = (q, ans, unit) => ({ key:'n:'+q, type:'num', q, ans, unit });
  const D = t('divSym');
  // fixed, repeatable sample of a big family of sums, so every sum keeps its own place in the child's memory
  const gen = (id, n, make) => {
    let s = 7; for(const ch of id) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
    const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
    const ri = (a, b) => a + Math.floor(r() * (b - a + 1)), pk = arr => arr[Math.floor(r() * arr.length)];
    const out = [], seen = new Set(); let guard = 0;
    while(out.length < n && guard++ < n * 60){ const it = make(ri, pk); if(it && (it.type !== 'num' || (Number.isInteger(it.ans) && it.ans >= 0)) && !seen.has(it.key)){ seen.add(it.key); out.push(it); } }
    return out;
  };
  const taf = n => { const o = []; for(let k=1;k<=10;k++) o.push(N(`${k} × ${n} =`, k*n)); return o; };
  const deel = ns => { const o = []; ns.forEach(n => { for(let k=1;k<=10;k++) o.push(N(`${k*n} ${D} ${n} =`, k)); }); return o; };
  const story = (list, unit) => list.map(x => N(x[0], x[1], x[2]));

  // ----- groep 4: getallen tot 100, eerste tafels -----
  add('te100', gen('te100', 20, (ri) => { const T10 = ri(2,9)*10, e = ri(1,9), f = ri(0,2);
    return f===0 ? N(`${T10+e} = ${T10} +`, e) : f===1 ? N(`${T10} + ${e} =`, T10+e) : N(`${T10+e} − ${e} =`, T10); }), 4);
  add('buur100', gen('buur100', 20, (ri) => { const n = ri(12,88), f = ri(0,3);
    return f===0 ? N(t('qAfter',{n}), n+1) : f===1 ? N(t('qBefore',{n}), n-1) : f===2 ? N(`${n} + 10 =`, n+10) : N(`${n} − 10 =`, n-10); }), 4);
  add('plus100a', gen('plus100a', 24, (ri) => { const f = ri(0,2);
    if(f===0){ const a = ri(1,8)*10, b = ri(1,9-a/10)*10; return N(`${a} + ${b} =`, a+b); }
    if(f===1){ const a = ri(2,9)*10 + ri(1,8), b = ri(1, 9 - a%10); return N(`${a} + ${b} =`, a+b); }
    const a = ri(11,69), b = ri(1, Math.floor((99-a)/10))*10; return N(`${a} + ${b} =`, a+b); }), 4);
  add('min100a', gen('min100a', 24, (ri) => { const f = ri(0,2);
    if(f===0){ const a = ri(2,9)*10, b = ri(1,a/10-1)*10; return N(`${a} − ${b} =`, a-b); }
    if(f===1){ const a = ri(2,9)*10 + ri(2,9), b = ri(1, a%10 - 1); return N(`${a} − ${b} =`, a-b); }
    const a = ri(31,99), b = ri(1, Math.floor(a/10)-1)*10; return N(`${a} − ${b} =`, a-b); }), 4);
  add('taf2', taf(2), 4); add('taf10', taf(10), 4); add('taf5', taf(5), 4);
  add('plus100b', gen('plus100b', 24, (ri) => { if(ri(0,1)===0){ const e = ri(3,9), a = ri(1,8)*10 + e, b = ri(11-e, 9); return N(`${a} + ${b} =`, a+b); }
