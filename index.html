      ['Wat is het onderwerp? "In de tuin zingt een vogel."','een vogel','zingt','In de tuin'],['Wat is de persoonsvorm? "In de tuin zingt een vogel."','zingt','een vogel','In de tuin'],
      ['Wat is het onderwerp? "Gisteren kocht mama een jas."','mama','kocht','een jas'],['Wat is de persoonsvorm? "De kinderen eten een appel."','eten','De kinderen','een appel']]);
  }
  return _langSkills[L] = S;
}
function skillsFor(subj){ return subj==='math' ? mathSkills() : langSkills(); }
function skillName(sk){ return t('skill')[sk.id] || sk.id; }
function skillStat(p, sk){
  let seen = 0, ok = 0;
  sk.items.forEach(it => { const m = memOf(p, it.key); if(m){ seen++; if(m.b >= 2) ok++; } });
  return { seen, ok, total: sk.items.length, done: ok >= Math.ceil(sk.items.length * 0.8) };
}
function startIdx(p, subj){ return Math.min((p.start && p.start[subj]) || 0, skillsFor(subj).length - 1); }
function curSkillIdx(p, subj){
  const S = skillsFor(subj); let i = startIdx(p, subj);
  while(i < S.length - 1 && skillStat(p, S[i]).done) i++;
  return i;
}
function itemLabel(it){
  if(it.type==='count') return String(it.n);
  if(it.type==='sum') return `${it.a} ${it.op==='add'?'+':'−'} ${it.b}`;
  if(it.type==='split') return `${it.n} → ${it.k} + ${it.n - it.k}`;
  if(it.type==='klank') return it.k;
  if(it.type==='num' || it.type==='mc') return it.q;
  return wordOf(it.w);
}

/* ============================================================
   DAILY PRACTICE — 10 questions, chosen for this child:
   1. something missed a moment ago comes back,
   2. then things that are due for review (weakest first),
   3. then new things from the current step (fewer when it is hard),
   4. otherwise things already known, for confidence.
   ============================================================ */
const PR_TOTAL = 10;
let pr = null;

function prStart(subj, test){
  const p = cur();
  pr = { test: !!test, total: test ? 20 : PR_TOTAL, log: [], subj, q:0, results:[], newCount:0, reviews:0, wrongs:0, retry:[], shown:[], first:0, skill0: curSkillIdx(p, subj) };
  screen = 'practice';
  prSetup(prPick());
}
function prPick(){
  const p = cur(), S = skillsFor(pr.subj), ci = curSkillIdx(p, pr.subj), si = startIdx(p, pr.subj), today = dayNum();
  if(pr.test){   // a mix of everything up to the current step, mostly things practised before
    const all = []; S.forEach((sk, i) => { if(i <= ci && sk.g >= S[ci].g - 1) sk.items.forEach(it => all.push(it)); });   // this groep and the one before
    const un = shuffle(all.filter(it => !pr.shown.includes(it.key))), seen = un.filter(it => memOf(p, it.key));
    return (Math.random() < .7 && seen.length ? seen[0] : un[0]) || all[0];
  }
  const ri = pr.retry.findIndex(r => pr.q - r.at >= 2);
  if(ri >= 0) return pr.retry.splice(ri, 1)[0].it;
  const pool = []; for(let i=si;i<=ci;i++) S[i].items.forEach(it => pool.push(it));
  const used = k => pr.shown.includes(k);
  const due = shuffle(pool.filter(it => { const m = memOf(p, it.key); return m && m.d <= today && !used(it.key); }))
              .sort((a, b) => memOf(p, a.key).b - memOf(p, b.key).b);
  if(due.length && pr.reviews < 5){ pr.reviews++; return due[0]; }
  let fresh = shuffle(S[ci].items.filter(it => !memOf(p, it.key) && !used(it.key)));
  if(!fresh.length) fresh = shuffle(pool.filter(it => !memOf(p, it.key) && !used(it.key)));   // leftovers from earlier steps
  if(fresh.length && pr.newCount < (pr.wrongs >= 3 ? 3 : 10)){ pr.newCount++; return fresh[0]; }
  if(due.length) return due[0];
  const recent = pr.shown.slice(-3);
  const rest = shuffle(pool.filter(it => !recent.includes(it.key))).sort((a, b) => (memOf(p, a.key)||{b:0}).b - (memOf(p, b.key)||{b:0}).b);
  return rest[0] || pool[0];
}
function prSetup(it){
  const p = cur(), m = memOf(p, it.key), L = state.lang;
  Object.assign(pr, { item:it, attempts:0, input:'', boxCls:'', busy:false, revealed:false, pos:0, mist:0, wrongHere:0, buf:'',
                      choices:null, answer:null, word:null, tiles:null });
  pr.scaffold = (it.type==='sum' || it.type==='count') && (!m || m.b < 1);   // picture first, then the bare sum
  if(it.type==='count') pr.answer = it.n;
  if(it.type==='sum')   pr.answer = it.ans;
  if(it.type==='split'){ pr.blank = Math.random() < .5 ? 'l' : 'r'; pr.answer = pr.blank==='l' ? it.k : it.n - it.k; }
  if(it.type==='klank'){
    const cands = WORDS[L].flat().filter(w => soundsOf(w).includes(it.k));
    pr.word = pick(cands); pr.pos = soundsOf(pr.word).indexOf(it.k);
    const all = [...new Set(WORDS[L].flat().flatMap(soundsOf))], sameKind = all.filter(s => VOWELISH.test(s) === VOWELISH.test(it.k) && s !== it.k);
    const ds = [...new Set([...(LOOKALIKE[it.k] || []).filter(x => all.includes(x)), ...shuffle(sameKind)])].filter(x => x !== it.k).slice(0, 3);
    pr.choices = shuffle([it.k, ...ds]); pr.answer = it.k;
  }
  if(it.type==='read'){
    pr.word = it.w;
    const others = shuffle(WORDS[L].flat().filter(w => w[1] !== it.w[1])).map(w => w[1]);
    pr.choices = shuffle([it.w[1], ...[...new Set(others)].slice(0, 3)]); pr.answer = it.w[1];
  }
  if(it.type==='build'){ pr.word = it.w; pr.tiles = soundTiles(it.w, it.lv); }
  if(it.type==='num') pr.answer = it.ans;
  if(it.type==='mc'){ pr.choices = shuffle(it.opts.slice()); pr.answer = it.ans; }
  if(pr.test) pr.scaffold = false;
  prRender();
}
function prRender(){
  const it = pr.item, sk = skillsFor(pr.subj).find(s => s.items.includes(it));
  let dots = '';
  for(let k=0;k<pr.total;k++){ const r = pr.results[k]; dots += `<div class="dot ${r||''} ${k===pr.q && !r?'cur':''}"></div>`; }
  const ansBox = `<div class="answer ${pr.input!==''?'filled':''} ${pr.boxCls} ${String(pr.answer).length > 2 ? 'long' : ''}" id="panswer">${pr.input}</div>`;
  const pad = () => { let k = ''; [1,2,3,4,5,6,7,8,9].forEach(n => k += `<button class="key" data-pkey="${n}">${n}</button>`);
    return `<div class="pad">${k}<button class="key del" data-pkey="del" aria-label="delete">⌫</button><button class="key" data-pkey="0">0</button><button class="key go" data-pkey="ok" aria-label="check">✓</button></div>`; };
  let art = '', body = '', below = '', hint = '';
  if(it.type==='count'){
    art = `<div class="pics">${cartonsHTML(Array(it.n).fill('a'))}</div>`;
    body = `<div class="sum text"><span>${t('prHowMany')}</span>${ansBox}</div>`; below = pad();
  } else if(it.type==='sum'){
    if(pr.scaffold && picsOn()){
      const eggs = [];
      if(it.op==='add'){ for(let k=0;k<it.a;k++) eggs.push('a'); for(let k=0;k<it.b;k++) eggs.push('b'); }
      else { for(let k=0;k<it.a;k++) eggs.push(k < it.a - it.b ? 'a' : 'a gone'); }
      art = `<div class="pics">${cartonsHTML(eggs)}</div>`;
    }
    body = `<div class="sum"><span>${it.a}</span><span>${it.op==='add'?'+':'−'}</span><span>${it.b}</span><span>=</span>${ansBox}</div>`; below = pad();
  } else if(it.type==='split'){
    if(pr.scaffold && picsOn()){ const eggs = []; for(let k=0;k<it.n;k++) eggs.push(k < it.k ? 'a' : 'b'); art = `<div class="pics">${cartonsHTML(eggs)}</div>`; }
    const box = side => side === pr.blank ? `<div class="sbox q ${pr.boxCls}" id="panswer">${pr.input}</div>` : `<div class="sbox">${side==='l' ? it.k : it.n - it.k}</div>`;
    body = `<div class="split" style="margin:6px auto">
      <div class="split-top">${it.n}</div>
      <svg class="split-lines" viewBox="0 0 200 44"><line x1="100" y1="4" x2="46" y2="40"/><line x1="100" y1="4" x2="154" y2="40"/></svg>
      <div class="split-bottom">${box('l')}${box('r')}</div></div>`; below = pad();
  } else if(it.type==='num'){
    const unit = it.unit ? `<span class="unit">${it.unit}</span>` : '';
    body = it.q.length <= 18 ? `<div class="sum mid"><span>${it.q}</span>${ansBox}${unit}</div>`
                             : `<p class="story">${it.q}</p><div class="sum mid">${ansBox}${unit}</div>`;
    below = pad();
  } else if(it.type==='mc'){
    body = `<p class="story ${it.q.length <= 24 ? 'big' : ''}">${it.q}</p>`;
    below = `<div class="tchoices">${pr.choices.map((c, i) => `<button class="tchoice" data-pchoice="${i}">${c}</button>`).join('')}</div>`;
  } else if(it.type==='klank'){
    art = `<div class="picbtn">${pr.word[1]}</div>`;
    body = `<div class="slots">${soundsOf(pr.word).map((sd, i) => i===pr.pos
      ? `<div class="slot cur" id="pslot" style="min-width:${30+22*sd.length}px"></div>` : `<div class="slot done" style="min-width:${30+22*sd.length}px">${sd}</div>`).join('')}</div>`;
    hint = t('prKlankQ');
    below = `<div class="letters">${pr.choices.map((c, i) => `<button class="ltile big ${c.length>1?'wide':''}" data-pchoice="${i}">${c}</button>`).join('')}</div>`;
  } else if(it.type==='read'){
    body = `<div class="readword">${klankOn() ? klankHTML(pr.word) : wordOf(pr.word)}</div>`; hint = t('readQ');
    below = `<div class="choices four">${pr.choices.map((c, i) => `<button class="choice" data-pchoice="${i}">${c}</button>`).join('')}</div>`;
  } else {
    const snds = soundsOf(pr.word);
    art = `<div class="picbtn">${pr.word[1]}</div>`;
    body = `<div class="slots">${snds.map((sd, k) => `<div class="slot ${k<pr.pos?'done':''} ${k===pr.pos?'cur':''}" style="min-width:${30+22*sd.length}px">${k<pr.pos ? sd : (k===pr.pos ? pr.buf : '')}</div>`).join('')}</div>`;
    hint = t('writeQ');
    below = `<div class="letters">${pr.tiles.map(x => `<button class="ltile ${x.length>1?'wide':''}" data-ptile="${x}">${x}</button>`).join('')}</div>`;
  }
  $('#main').innerHTML = `
    <div class="topbar"><button class="back" data-action="menu" aria-label="back">←</button><div class="dots">${dots}</div></div>
    <p class="levelname">${sk ? skillName(sk) : ''}</p>
    <div class="card">
      ${art}${body}
      <div class="hint">${hint}</div>
      <div class="feedback" id="feedback"></div>
    </div>
    ${below}`;
}
function prFb(text, cls){ const fb = $('#feedback'); if(fb){ fb.textContent = text; fb.className = 'feedback ' + cls; } }

/* a question is finished: remember it, and plan a retry when it was not right first time */
function prDone(firstTry){
  if(pr.test) return prTestAnswer(firstTry, '');
  const it = pr.item;
  record(it.key, firstTry); persist();
  pr.results[pr.q] = firstTry ? 'g' : (pr.revealed ? 'r' : 'o');
  if(firstTry) pr.first++; else { pr.wrongs++; pr.retry.push({ it, at: pr.q }); }
  pr.shown.push(it.key); pr.busy = true;
  setTimeout(prAdvance, pr.revealed ? 2300 : 1100);
}
function prTestAnswer(ok, given){
  const it = pr.item;
  record(it.key, ok); persist();
  pr.log.push({ it, ok, given });
  pr.results[pr.q] = 't'; if(ok) pr.first++;
  pr.shown.push(it.key); pr.busy = true;
  setTimeout(prAdvance, 350);
}
function itemAnswer(it){
  if(it.type==='count') return it.n;
  if(it.type==='split') return `${it.k} + ${it.n - it.k}`;
  if(it.type==='klank') return it.k;
  if(it.type==='read' || it.type==='build') return wordOf(it.w);
  return it.ans;
}
function prTestReport(){
  const p = cur(), subj = pr.subj, S = skillsFor(subj), by = new Map();
  pr.log.forEach(l => { const sk = S.find(x => x.items.includes(l.it)); const e = by.get(sk) || { ok:0, n:0 }; e.n++; if(l.ok) e.ok++; by.set(sk, e); });
  let rows = ''; by.forEach((e, sk) => { rows += `<div class="prow"><span class="pn">${e.ok === e.n ? '✅' : '👉'} ${skillName(sk)}</span>
    <span class="pbar"><i style="width:${Math.round(e.ok / e.n * 100)}%"></i></span><span class="pc">${e.ok}/${e.n}</span></div>`; });
  const wrong = pr.log.filter(l => !l.ok);
  const list = wrong.map(l => `<li><span>${itemLabel(l.it)}</span> <b>${itemAnswer(l.it)}</b>${l.given !== '' ? ` <em>${t('testYours', { a: esc(l.given) })}</em>` : ''}</li>`).join('');
  $('#main').innerHTML = `
    <div class="result">
      ${buddySVG(110)}
      <h2>${t('testDone')}</h2>
      <p>${t('testScore', { c: pr.first, n: pr.total })}</p>
      <div class="report">${rows}</div>
      ${wrong.length ? `<div class="report"><h3>${t('testLook')}</h3><ul class="wronglist">${list}</ul></div>` : ''}
      ${gainHTML(1)}
      <div class="btns">
        <button class="btn primary" data-action="${subj==='math' ? 'prMath' : 'prLang'}">${t('testPractise')}</button>
        <button class="btn" data-action="menu">${t('prHome')}</button>
      </div>
    </div>`;
  confetti();
}
function prAdvance(){
  if(screen !== 'practice') return;
  pr.q++;
  if(pr.q >= pr.total) return prFinish();
  prSetup(prPick());
}
function prKey(k){
  if(screen !== 'practice' || pr.busy || !['count','sum','split','num'].includes(pr.item.type)) return;
  if(k==='del') pr.input = pr.input.slice(0, -1);
  else if(k==='ok'){
    if(pr.input==='') return;
    if(pr.test) return prTestAnswer(pr.input === String(pr.answer), pr.input);
    if(pr.input === String(pr.answer)){ pr.boxCls = 'good'; prRender(); prFb(pick(T[state.lang].good), 'good'); return prDone(pr.attempts===0); }
    pr.attempts++;
    if(pr.attempts >= 2){
      pr.input = String(pr.answer); pr.boxCls = 'bad'; pr.revealed = true; pr.scaffold = true; prRender();
      prFb(t('answerIs', { n: pr.answer }), 'bad'); return prDone(false);
    }
    pr.boxCls = 'bad shake'; pr.scaffold = true; prRender(); prFb(t(picsOn() ? 'prLook' : 'tryAgain'), 'bad');
    pr.input = ''; pr.boxCls = ''; return;
  }
  else if(/^[0-9]$/.test(k) && pr.input.length < Math.max(2, String(pr.answer).length + 1)) pr.input = (pr.input==='0' ? '' : pr.input) + k;
  else return;
  prRender();
}
function prChoose(btn){
  if(screen !== 'practice' || pr.busy || btn.disabled) return;
  const val = pr.choices[+btn.dataset.pchoice];
  if(pr.test){ btn.classList.add('picked'); return prTestAnswer(val === pr.answer, val); }
  if(val === pr.answer){
    btn.classList.add('right');
    const sl = $('#pslot'); if(sl){ sl.textContent = pr.answer; sl.classList.add('good'); }
    prFb(pick(T[state.lang].good), 'good');
    return prDone(pr.attempts===0);
  }
  pr.attempts++; btn.classList.add('wrong'); btn.disabled = true;
  if(pr.attempts >= 2){
    pr.revealed = true;
    document.querySelectorAll('[data-pchoice]').forEach(b => { if(pr.choices[+b.dataset.pchoice] === pr.answer) b.classList.add('right'); });
    const sl = $('#pslot'); if(sl){ sl.textContent = pr.answer; sl.classList.add('bad'); }
    prFb(pr.item.type==='read' ? t('wordWas', { w: wordOf(pr.word) }) : (pr.item.type==='mc' ? t('measureShown') : t('answerIs', { n: pr.answer })), 'bad');

    return prDone(false);
  }
  prFb(t('tryAgain'), 'bad');
}
function prTile(sd){
  if(screen !== 'practice' || pr.busy || pr.item.type !== 'build') return;
  const snds = soundsOf(pr.word), need = snds[pr.pos];
  pr.buf = '';
  if(sd === need){
    pr.pos++; pr.wrongHere = 0;
    if(pr.pos === snds.length){
      prRender(); document.querySelectorAll('.slot').forEach(x => x.classList.add('good'));
      prFb(pick(T[state.lang].good), 'good');
      return prDone(pr.mist===0);
    }
    return prRender();
  }
  pr.mist++; pr.wrongHere++; prRender();
  const slot = document.querySelectorAll('.slot')[pr.pos]; if(slot) slot.classList.add('shake','bad');
  if(need.length > sd.length && need.startsWith(sd)) prFb(t('moreLetters', { n: need.length }), 'bad');
  else if(sd.length > need.length && sd.startsWith(need)) prFb(t('fewerLetters'), 'bad');
  else prFb(t('tryAgain'), 'bad');
  if(pr.wrongHere >= 2) document.querySelectorAll('[data-ptile]').forEach(b => { if(b.dataset.ptile === need) b.classList.add('glow'); });
}
function prTypeLetter(l){
  if(pr.busy || pr.item.type !== 'build') return;
  const need = soundsOf(pr.word)[pr.pos], buf = pr.buf + l;
  if(buf === need) return prTile(buf);
  if(need.startsWith(buf)){ pr.buf = buf; return prRender(); }
  prTile(buf);
}
function skillBar(p, subj){
  const S = skillsFor(subj), i = curSkillIdx(p, subj), st = skillStat(p, S[i]);

function prFinish(){

function startSelect(subj, val){

function progressHTML(p){
  const part = subj => {
    const S = skillsFor(subj), ci = curSkillIdx(p, subj), si = startIdx(p, subj);
    let rows = '', hard = [];
    S.forEach((sk, i) => {
      const st = skillStat(p, sk);
      if((i < si && !st.seen) || i > ci + 4) return;
      rows += `<div class="prow ${i===ci?'now':''}"><span class="pn">${st.done ? '✅' : (i===ci ? '👉' : '▫️')} ${skillName(sk)}</span>
        <span class="pbar"><i style="width:${Math.round(st.ok / st.total * 100)}%"></i></span><span class="pc">${st.ok}/${st.total}</span></div>`;
      sk.items.forEach(it => { const m = memOf(p, it.key); if(m && m.w >= 2 && m.b < 2) hard.push(itemLabel(it)); });
    });
    hard = [...new Set(hard)].slice(0, 14);
    return `<div class="flabel">${subj==='math' ? '🔢 ' + t('prMathBtn') : '📖 ' + t('prLangBtn')}</div>${rows}
      ${hard.length ? `<div class="hardrow"><span>${t('prHard')}</span>${hard.map(h => `<em>${h}</em>`).join('')}</div>` : ''}`;
  };
  return `<div class="progress"><h2 class="sec2">${t('prProgress')}</h2><div class="pgrid"><div>${part('math')}</div><div>${part('lang')}</div></div></div>`;

document.addEventListener('click', e => {
  const pk = e.target.closest('[data-pkey]');    if(pk){ prKey(pk.dataset.pkey); return; }
  const pc = e.target.closest('[data-pchoice]'); if(pc){ prChoose(pc); return; }
  const pt = e.target.closest('[data-ptile]');   if(pt){ prTile(pt.dataset.ptile); return; }
  const langBtn = e.target.closest('[data-lang]');
  if(langBtn){ state.lang = langBtn.dataset.lang; persist(); renderChrome(); rerender(); return; }
  const lvl = e.target.closest('[data-level]');
  if(lvl){ const i = +lvl.dataset.level; unlocked(i) ? startLevel(i) : toast(t('locked')); return; }
  const prof = e.target.closest('[data-profile]');
  if(prof){ chooseProfile(prof.dataset.profile); return; }
  const ed = e.target.closest('[data-edit]');
  if(ed){ renderProfileForm(ed.dataset.edit); return; }
  const av = e.target.closest('[data-avatar]');
  if(av){ editing.avatar = av.dataset.avatar; document.querySelectorAll('.av').forEach(b => b.classList.toggle('on', b===av)); return; }
  const wl = e.target.closest('[data-wlevel]');
  if(wl){ const i = +wl.dataset.wlevel; wordUnlocked(wgame.mode, i) ? startWordLevel(wgame.mode, i)
    : toast(needsReading(wgame.mode, i) ? t('needRead', {lvl: t('readLv')[WORD_LEVELS[i].needRead]}) : t('locked')); return; }
  const ml = e.target.closest('[data-mlevel]');
  if(ml){ startMeasure(+ml.dataset.mlevel); return; }
  const mc = e.target.closest('[data-mchoice]');
  if(mc){ chooseMeasure(mc); return; }
  const cl = e.target.closest('[data-clevel]');
  if(cl){ const i = +cl.dataset.clevel; clockUnlocked(i) ? startClock(i) : toast(t('locked')); return; }
  const ct = e.target.closest('[data-ctime]');
  if(ct){ chooseTime(ct); return; }
  const ch = e.target.closest('[data-choice]');
  if(ch){ chooseReading(ch); return; }
  const lt = e.target.closest('[data-letter]');
  if(lt){ typeSound(lt.dataset.letter); return; }
  const fl = e.target.closest('[data-flash]');
  if(fl){ startFlash(fl.dataset.flash); return; }
  const key = e.target.closest('[data-key]');
  if(key){ press(key.dataset.key); return; }
  const act = e.target.closest('[data-action]');
  if(act){
    const a = act.dataset.action;
    if(a==='pics'){ const p = cur(); if(p){ p.pics = !picsOn(); persist(); renderChrome(); if(screen==='play' || screen==='flash') rerender(); } }
    if(a==='who') renderWho();
    if(a==='newProfile') renderProfileForm(null);
    if(a==='saveProfile') saveProfile();
    if(a==='delAsk') $('#delRow').innerHTML = `<div class="confirm"><span>${t('delAsk', {name: esc(editing.name || t('newProfile'))})}</span>
        <button class="btn" data-action="delNo">${t('cancel')}</button>
        <button class="btn danger" data-action="delYes">${t('delYes')}</button></div>`;
    if(a==='delNo' || a==='resetNo'){ editing.name = $('#pname').value; drawForm(); }
    if(a==='delYes'){
      state.profiles = state.profiles.filter(p => p.id!==editing.id);
      if(state.current===editing.id) state.current = null;
      persist(); renderWho();
    }
    if(a==='resetAsk') $('#resetRow').innerHTML = `<div class="confirm"><span>${t('resetAsk', {name: esc(displayName(state.profiles.find(x => x.id===editing.id)))})}</span>
        <button class="btn" data-action="resetNo">${t('cancel')}</button>
        <button class="btn danger" data-action="resetYes">${t('resetYes')}</button></div>`;
    if(a==='resetYes'){
      const ep = state.profiles.find(x => x.id===editing.id);
      ep.stars = {}; ep.starsRead = {}; ep.starsWrite = {}; ep.starsClock = {}; ep.starsMeasure = {}; ep.mem = {}; ep.brainBy = {math:0, read:0, write:0}; ep.days = []; delete ep.brain; persist();
      editing.name = $('#pname').value; drawForm(); toast(t('resetDone'));
    }
    if(a==='flip') flipCard();
    if(a==='sflip') flipSound();
    if(a==='sknew') rateSound(true);
    if(a==='spractise') rateSound(false);
    if(a==='knew') rateCard(true);
    if(a==='practise') rateCard(false);
    if(a==='flashAgain') startFlash(flash.which);
    if(a==='home' || a==='levels') renderHome();
    if(a==='menu' && cur()) renderMenu();
    if(a==='klank'){ const p = cur(); if(p){ p.klank = !klankOn(); persist(); renderWordLevels('read'); } }
    if(a==='math') renderMathMenu();
    if(a==='prMath') prStart('math');
    if(a==='prLang') prStart('lang');
    if(a==='testMath') prStart('math', true);
    if(a==='testLang') prStart('lang', true);
    if(a==='clockPick' || a==='clockLevels') renderClockLevels();
    if(a==='measurePick' || a==='measureLevels') renderMeasureLevels();
    if(a==='measureAgain') startMeasure(mgame.level);
    if(a==='measureNext') startMeasure(mgame.level+1);
    if(a==='clockAgain') startClock(cgame.level);
    if(a==='clockNext') startClock(cgame.level+1);
    if(a==='read' || a==='write') renderWordLevels(a);
    if(a==='wordLevels') renderWordLevels(wgame.mode);
    if(a==='wordAgain') startWordLevel(wgame.mode, wgame.level);
    if(a==='wordNext') startWordLevel(wgame.mode, wgame.level+1);
    if(a==='flashPick') renderFlashPick();
    if(a==='again') startLevel(game.level);
    if(a==='next') startLevel(game.level+1);
  }
});
document.addEventListener('keydown', e => {
  if(screen==='practice'){
    if(/^[0-9]$/.test(e.key)) prKey(e.key); else if(e.key==='Backspace') prKey('del'); else if(e.key==='Enter') prKey('ok');
    else if(/^[a-z]$/i.test(e.key)) prTypeLetter(e.key.toLowerCase());
    return;
  }
  if(screen==='profileForm'){ if(e.key==='Enter') saveProfile(); return; }
  if(screen==='word' && wgame.mode==='write'){ if(/^[a-z]$/i.test(e.key)) typeKey(e.key.toLowerCase()); return; }
  if(screen==='flash'){
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); flipCard(); }
    return;
  }
  if(screen==='sound'){
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); flipSound(); }
    return;
  }
  if(screen!=='play') return;
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==='Backspace') press('del');
  else if(e.key==='Enter') press('ok');
  else if(e.key==='+' || e.key==='-') press(e.key);
});
function rerender(){
  if(screen==='home') renderHome();
  else if(screen==='menu' || screen==='practice' || screen==='practiceResult') renderMenu();
  else if(screen==='math') renderMathMenu();
  else if(screen==='clockLevels' || screen==='clock' || screen==='clockResult') renderClockLevels();
  else if(screen==='measureLevels' || screen==='measure' || screen==='measureResult') renderMeasureLevels();
  else if(screen==='wordLevels' || screen==='word' || screen==='wordResult' || screen==='sound') renderWordLevels(wgame.mode);
  else if(screen==='flashPick') renderFlashPick();
  else if(screen==='play'){ renderPlay(); }
  else if(screen==='flash') renderFlash();
  else if(screen==='who') renderWho();
  else if(screen==='profileForm'){ editing.name = $('#pname').value; drawForm(); }
  else renderHome();
  renderChrome();
}

new MutationObserver(() => { document.body.dataset.screen = screen; }).observe($('#main'), { childList:true });

// Offline support when installed as an app (ignored where not allowed, e.g. inside Claude)
try{
  if('serviceWorker' in navigator && location.protocol==='https:' && !/claude\.ai|claudeusercontent/.test(location.hostname)){
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    // When a new version has been installed, reload once so it shows straight away
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(hadController && !reloaded){ reloaded = true; location.reload(); }
    });
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg => {
      // Home-screen apps often resume instead of restarting: check for updates when it comes back
      document.addEventListener('visibilitychange', () => { if(!document.hidden) reg.update().catch(()=>{}); });
    }).catch(()=>{});
  }
}catch(e){}

// Start: new device → create the first profile; otherwise ask who is playing.
if(state.profiles.length===0) renderProfileForm(null);
else renderWho();
</script>
</body>
</html>
